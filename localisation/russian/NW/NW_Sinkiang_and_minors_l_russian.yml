 #ивенты 
 NWsinkiang.1.t: "Незаконная закупка оружия"
 NWsinkiang.1.desc: "От полпреда СССР в Синьцзяне поступило донесение, что Махмут Мухити, командующий войсками Кашгарского округа и командир 6-й уйгурской дивизии, ставший после Кумульского восстания центром оппозиции нынешнему режиму, без нашего ведома попытался закупить советские винтовки для нужд дивизии. Как нам отреагировать?"
 NWsinkiang.1.a: "Лишние винтовки никогда не помешают"
 NWsinkiang.1.b: "Запретить сделку. Уйгуры явно что-то замышляют"
 
 NWsinkiang.2.t: "Убийство кади"
 NWsinkiang.2.desc: "Кади Кашгара Абдулгафур Дамулла, один из немногих авторитетных уйгуров, лояльных режиму Шэн Шицая, вчера был публично убит в Кашгаре. Убийца застрелился на месте, его личность установить не удалось. По городу ходят слухи, что покушение организовал генерал Махмут Мухити — командующий войсками округа, оппозиционный нашему режиму. Мы можем использовать это для подрыва его влияния."
 NWsinkiang.2.a: "Не стоит играть с огнём, нам не нужны проблемы с уйгурами..."
 NWsinkiang.2.b: "Публично осудить Мухити и объявить его японским шпионом"
 
 NWsinkiang.3.t: "Восстание Абдуллы Нияза"
 NWsinkiang.3.desc: "Дубань Синьцзяна Шэн Шицай пригласил командира 6-й дивизии Махмута Мухити на III конгресс народных представителей провинции как лидера уйгурского населения. Мухити понял, чем это может для него закончиться. Он приказал своему заместителю Абдулле Ниязу поднять восстание, а сам бежал в Индию искать поддержки у правительств Великобритании и Чан Кайши, пообещав вернуться через год. Если ему, конечно, будет куда возвращаться..."
 NWsinkiang.3.a: "Уйгуры будут свободны!"
 
 NWsinkiang.4.t: "Уйгурское восстание"
 NWsinkiang.4.desc: "Произошло то, чего так долго пытались избежать провинциальные власти: уйгуры снова восстали. Пока что они захватили власть только в Кашгарском округе. Руководителем восстания стал заместитель командира 6-й дивизии Абдулла Нияз. Местонахождение командира дивизии Махмута Мухити неизвестно."
 NWsinkiang.4.a: "Этого и следовало ожидать"

 NWsinkiang.5.t: "Уйгурское восстание"
 NWsinkiang.5.desc_a: "От наших недавних врагов — уйгуров — поступило неожиданное предложение: объединиться и вместе вести борьбу против предателей, впустивших на территорию провинции советские войска и большевиков."
 NWsinkiang.5.desc_b: "Махмут Мухити, поднявший восстание в Кашгаре, предлагает нам присоединиться к нему, чтобы изгнать из провинции большевиков и предателей во главе с Шэном Шицаем. Под нашим контролем находится стратегически важный округ Хами, через который проходит единственная дорога из Урумчи во внутренний Китай. Таким образом мы сможем отрезать Шэн Шицая от центрального правительства."
 NWsinkiang.5.desc_c: "Махмут Мухити, поднявший восстание в Кашгаре, предлагает нам присоединиться к нему, чтобы изгнать из провинции большевиков и предателей во главе с Шэном Шицаем."
 NWsinkiang.5.a: "Мы присоединяемся к восстанию!"
 NWsinkiang.5.b: "Это слишком рискованно"

 NWsinkiang.5.a: "Мы присоединяемся к восстанию!"
 NWsinkiang.5.b: "Это слишком рискованно"
  
 NWsinkiang.6.t: "[From.GetName] присоединяется к восстанию"
 NWsinkiang.6.desc: "[From.GetLeader] согласился помочь нам и мобилизовал армию на борьбу с провинциальными войсками Шэна."
 NWsinkiang.6.a: "Вместе мы сильнее"

 NWsinkiang.7.t: "Отказ от [From.GetLeader]"
 NWsinkiang.7.desc: "[From.GetAdjective] губернатор [From.GetLeader] отказался поддержать восстание, так как считает, что у него нет шансов на победу."
 NWsinkiang.7.a: "В этой мясорубке не выживет никто" 
  
