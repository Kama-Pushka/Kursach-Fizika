 NW_SWE.1.t: "Выбор варианта законопроекта"
 NW_SWE.1.d: "До принятия законопроекта парламентская комиссия по обороне исследовала будущее обороны, придя к выводу, что годовой оборонный бюджет должен составлять 148 миллионов крон. Лидеры социал-демократов предлагают сокращённый проект, предполагающий лишь 130 миллионов крон.\n\nЗаконопроекту предшествовали внутренние дискуссии внутри социал-демократов, когда Пер Эдвин Скёльд и Густав Мёллер сформировали внутри партии фракцию, желавшую отложить решение по оборонному бюджету до выборов, поскольку в случае возможного поражения на выборах они хотели вынести этот вопрос на обсуждение оппозиции. Это было связано с тем, что несколько ведущих социал-демократов считали, что социал-демократы как партия не могут работать над увеличением расходов на оборону. Но в то же время существовало мнение, что независимо от партийной принадлежности ни одно правительство, в силу внешней ситуации, не может предложить сокращенный оборонный бюджет. Поэтому часть социал-демократической партии считала, что лучше, если решение будет принято буржуазными партиями.\n\nПер Альбин Ханссон считает же, что расходы на оборону могут резко возрасти при буржуазном правительстве, в то время как социал-демократическое правительство может оказать сдерживающее воздействие на оборонный бюджет."
 NW_SWE.1.a: "Мы предложим собственный, урезанный вариант законопроекта"
 NW_SWE.1.b: "Мы согласны на вариант, предложенный Комиссией"
 
 NW_SWE.2.t: "Недовольство проектом закона"
 NW_SWE.2.d: "Социал-демократическое правительство меньшинства под руководством Пер Альбина Ханссона внесло в Риксдаг свой компромиссный законопроект. Социал-демократы предложили незначительно увеличить военные расходы (до 130-148 млн крон), однако правая оппозиция сочла эту сумму недостаточной, требуя масштабного перевооружения и более жёстких мер. Ситуация усугубилась спорами о финансировании: левые требуют прогрессивного налога на богатых, а правые – равного участия всех слоев населения. Оппозиционные правые партии заблокировали правительственный проект в парламенте. В ответ они выдвинули собственное контрпредложение, основанное на выводах Комитета по обороне."
 NW_SWE.2.a: "Хорошо, мы примем проект Комитета по обороне"
 NW_SWE.2.b: "Предложим тогда им принять совместно с этим увеличение пенсий"
 NW_SWE.2.c: "Тогда лучше уйдём в отставку"
 
 NW_SWE.3.t: "Отказ буржуазного большинства"
 NW_SWE.3.d: "Правительство Ханссона предложило хитрый ход – вместе с расширением военного бюджета, они потребовали одновременно принять законопроект об увеличении пенсий. Правые ожидаемо выступили против такого предложения, но это позволило социал-демократам заработать ещё очков репутации перед электоратом на фоне идущих дебатов, выставляя себя как заботящихся о стариках политиках против милитаризма правых."
 NW_SWE.3.a: "Теперь мы должны уйти в отставку, чтобы улучшить свои позиции"
 NW_SWE.3.b: "Мы сделали всё что могли"
 
 NW_SWE.4.t: "Каникулярное правительство"
 NW_SWE.4.desc: "В связи с уходом в отставку премьер-министра Пер Альбин Ханссона, королю необходимо выбрать представителя одной из буржуазных парламентских партий, который сможет сформировать новое правительство. Оно заведомо просуществует недолго так как впереди страну ждут парламентские выборы, поэтому некоторые уже окрестили его «каникулярное правительство»."
 NW_SWE.4.a: "Пусть этим займётся лидер консерваторов, Гёста Багге"
 NW_SWE.4.b: "Это должны сделать либералы под управлением Феликса Хамрина"
 NW_SWE.4.c: ""
 NW_SWE.4.d: "Лидер аграриев, Аксель Перссон-Брамсторп, справится с этим"
 
 NW_SWE.5.t: "Результаты поездки комиссии"
 NW_SWE.5.d: "Наша танковая комиссия посетила различные европейские страны и изучила их танковые войска и производства. Также они выяснили возможности по производству бронетехники для нашей страны и конкретные модели. Теперь нам нужно выбрать какой из этих стран отдать предпочтение."
 NW_SWE.5.a: "Выберем чешских производителей"
 NW_SWE.5.b: "Выберем французских производителей"
 NW_SWE.5.c: "Выберем немецких производителей"
 
 NW_SWE.6.t: "Выборы в нижнюю палату Риксдага"
 NW_SWE.6.d: "Вчера прошли всеобщие выборы в нижнюю палату парламента страны. Завершившийся сегодня подсчёт голосов дал итоговую оценку работы текущего правительства страны. Теперь премьер-министру предстоит принять решение о том, останется ли он и его министры на своих должностях, или они должны уйти в отставку."
 NW_SWE.6.a: "Сохраним старое правительство"
 NW_SWE.6.b: "Уходим в отставку"
 
 NW_SWE.7.t: "Формирование нового правительства"
 NW_SWE.7.desc: "Королю нужно выбрать кому предложить пост премьер-министра. Правительство должно обладать достаточным количеством депутатов в парламенте, чтобы эффективно работать и принимать законопроекты, поэтому возможно нам следует предложить выбрать премьером лидера наиболее популярной партии, или менее популярной, но способной пойти на коалицию с другими фракциями.\n\nОбычно, правые готовы объединиться в единую правую коалицию под руководством одного из лидеров, а социал-демократы могут брать в союзники аграриев или либералов и совсем изредка готовы рассматривать левых радикалов в качестве партнёров по коалиции."
 NW_SWE.7.a: "Социал-демократы должны возглавить кабинет"
 NW_SWE.7.b: "Либералы должны возглавить кабинет"
 NW_SWE.7.c: "Аграрии должны возглавить кабинет"
 NW_SWE.7.d: "Консерваторы должны возглавить кабинет"
 
 NW_SWE.9.t: "Пер Альбин Ханссон умер"
 NW_SWE.9.desc.a: "С самого утра сегодняшнего дня Ханссон жаловался на боль в левой руке, которую он едва мог поднять. Несмотря на боль, Ханссон был в хорошем настроении во время ужина. После кофе Ханссон играл в бридж со своими гостями. Ханссон покинул Операкелларен вскоре после полуночи и, как обычно, сел на трамвай № 12, чтобы добраться домой в свой таунхаус в Ольстене. Выйдя из трамвая на остановке Ольстенсгатан, он упал на землю, у него случился сердечный приступ. Считается, что он умер мгновенно. Свидетели происшествия вызвали полицию и скорую помощь, но, когда они прибыли в больницу Святого Горана, он уже был мёртв. Ханссон будет похоронен на Норра-бегравнингсплацен в Стокгольме."
 NW_SWE.9.desc.b: "$NW_SWE.9.desc.a$\n\nСоциал-демократам необходимо срочно выбрать человека, который заменит Ханссона на посту премьер-министра и самое главное, лидера партии. От этого будет зависеть то, каким курсом будет дальше развиваться левое движение в стране."
 NW_SWE.9.a: "Лидер партии - Эрнст Вигфорсс"
 NW_SWE.9.b: "Ветеран левого крыла - Густав Мёллер"
 NW_SWE.9.c: "Молодой компромиссный кандидат - Таге Эрландер"
 NW_SWE.9.d: "Архитектор Народного дома умер как простой человек"
 
 NW_SWE.10.t: "Консерваторы меняют название"
 NW_SWE.10.d: "Созданный в 1904 году «Всеобщий союз избирателей» изначально задумывался консерваторами не как классическая политическая партия (к партийным структурам тогда относились с предубеждением), а скорее как рыхлая, децентрализованная коалиция и координационный орган для сбора средств и ведения предвыборных кампаний.\n\nК текущему времени шведская политика полностью изменилась: социал-демократы выстроили мощную и дисциплинированную партийную машину. Консерваторам требовалось создать жёсткую общенациональную структуру с чётким партийным билетом, единой программой и централизованным лидерством под руководством своего лидера Гёста Багге.\n\nКроме того, до середины 1930-х годов шведские консерваторы в парламенте были разделены на две самостоятельные группы в зависимости от палаты. В 1935 году эти группы наконец преодолели внутренние разногласия и объединились в единую парламентскую фракцию - «Парламентскую группу правых». Название общенациональной организации, должно было отразить это долгожданное единство на уровне всей страны.\n\nК тому же, историческое название партии «Всеобщий союз избирателей» к сегодняшнему дню устарело и мало что говорит рядовому избирателю. Включение слова «Правые» в название покажет идеологию партии понятной и чёткой."
 NW_SWE.10.a: "Своевременное решение"
 
 NW_SWE.11.t: "Гёста Багге уходит с поста лидера консерваторов"
 NW_SWE.11.d: "Гёста Багге ушёл в отставку с поста лидера Правой партии. Главной причиной ухода стали результаты недавних парламентских выборов. Под руководством Багге консерваторы потеряли значительную часть мест, показав один из худших результатов в своей истории. Члены партии стали требовать обновления руководства. Изначально партийная элита и сам Гёста Багге видели идеальным преемником Мартина Скоглунда (влиятельного политика из Эстергётланда). Однако Скоглунд категорически и наотрез отказался брать на себя лидерство и ответственность за партию, переживающую кризис. После отказа Скоглунда руководство оперативно консолидировалось вокруг кандидатуры Фритьофа Доме. Он представляет умеренное аграрно-землевладельческое крыло партии. Сегодня на партийной конференции кандидатура Доме была официально утверждена без открытого противостояния или раскола."
 NW_SWE.11.a: "Конец карьеры профессора"
 
 NW_SWE.12.t: "Густав Андерссон уходит с поста лидера либералов"
 NW_SWE.12.d: "Густав Андерссон покинул пост главы Народной партии. Считается, что это подготовленный ход партийной элиты, которая понимает, что партия нуждается в обновлении. Левое крыло социал-демократов представило радикальную программу дальнейшего развития страны, которая предполагает сильное вмешательство государства в экономику и элементы социализации. Густав Андерссон, будучи прагматичным и приземленным политиком старой школы, не обладает нужным теоретическим весом для идеологической дуэли. Партии требуется лидер, способный на равных спорить с экономическим теоретиком социал-демократов Эрнстом Вигфорсом. Ему предложили престижный и спокойный пост губернатора его родной провинции Даларна (Коппарберг), что позволило совершить транзит власти мягко и без публичных скандалов. На смену ему приходит молодое светило либералов – Бертиль Улин, учёный-экономист, основатель Стокгольмской экономической школы и ученик Джона Мейнарда Кейнса. В 1934 году Улин был назначен председателем недавно созданной Молодежной лиги Народной партии, в которой он оставался до 1939 года. С 1937 года он все больше сосредотачивался на своей политической роли и теперь готов взять в свои руки руководство всей партией."
 NW_SWE.12.a: "С такими силами либералы могут занять новые высоты"
 
 NW_SWE.15.t: "Правые критикуют законопроект"
 NW_SWE.15.d: "Основные буржуазные партии объединились в своей критике рассматриваемого в Риксдаге законопроекта. Лидеры правых уже отказались принимать его, а либералы скорее находятся в подвешенном состоянии. В конечном счёте нам скорее всего придётся принимать законопроект без их поддержки."
 NW_SWE.15.a: "Этого стоило ожидать"
 
 
 
 NW_SWE_news.1.t: "[GetNewsHeadline]Швеция приняла новый Закон об обороне"
 NW_SWE_news.1.d: "Риксдаг Швеции после долгих дискуссий всё-таки принял новый законопроект об обороне. Он стал результатом почти шестилетней работы Комитета по обороне. Предыдущий закон об обороне 1925 года сильно урезал финансирование армии и флота на фоне разговоров о пацифизме и веры в Лигу Наций. Современные условия же диктуют даже нейтральному скандинавскому государству необходимость самостоятельно заботиться о своей безопасности. В первую очередь, за его принятие выступали правые партии и военные, а социал-демократы пытались добиться финансирования своих социальных программ."
 NW_SWE_news.1.a: "Швеция тоже теперь перевооружается"
 
 
