 SWE_the_defense_bill: "Законопроект об обороне"
 SWE_the_defense_bill_desc: "Закон об обороне 1925 года, принятый на волне послевоенного пацифизма и надежд на Лигу Наций, радикально сократил шведскую армию. Были расформированы многие полки, сокращены сроки службы. Еще в 1930 году была создана специальная Комиссия по обороне (Försvarskommissionen), призванная оценить потребности страны. Она завершила работу в 1935 году, рекомендовав существенно увеличить расходы."
