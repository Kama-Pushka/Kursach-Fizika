 NW_SWE.1.t: "Выбор варианта законопроекта"
 NW_SWE.1.d: "До принятия законопроекта парламентская комиссия по обороне исследовала будущее обороны, придя к выводу, что годовой оборонный бюджет должен составлять 148 миллионов крон. Лидеры социал-демократов предлагают сокращённый проект, предполагающий лишь 130 миллионов крон.\n\nЗаконопроекту предшествовали внутренние дискуссии внутри социал-демократов, когда Пер Эдвин Скёльд и Густав Мёллер сформировали внутри партии фракцию, желавшую отложить решение по оборонному бюджету до выборов, поскольку в случае возможного поражения на выборах они хотели вынести этот вопрос на обсуждение оппозиции. Это было связано с тем, что несколько ведущих социал-демократов считали, что социал-демократы как партия не могут работать над увеличением расходов на оборону. Но в то же время существовало мнение, что независимо от партийной принадлежности ни одно правительство, в силу внешней ситуации, не может предложить сокращенный оборонный бюджет. Поэтому часть социал-демократической партии считала, что лучше, если решение будет принято буржуазными партиями.\n\nПер Альбин Ханссон считает же, что расходы на оборону могут резко возрасти при буржуазном правительстве, в то время как социал-демократическое правительство может оказать сдерживающее воздействие на оборонный бюджет."
 NW_SWE.1.a: "Мы предложим собственный, урезанный вариант законопроекта"
 NW_SWE.1.b: "Мы согласны на вариант, предложенный Комиссией"
 
 NW_SWE.2.t: "Недовольство проектом закона"
 NW_SWE.2.d: "Социал-демократическое правительство меньшинства под руководством Пер Альбина Ханссона внесло в Риксдаг свой компромиссный законопроект. Социал-демократы предложили незначительно увеличить военные расходы (до 130-148 млн крон), однако правая оппозиция сочла эту сумму недостаточной, требуя масштабного перевооружения и более жёстких мер. Ситуация усугубилась спорами о финансировании: левые требуют прогрессивного налога на богатых, а правые – равного участия всех слоев населения. Оппозиционные правые партии заблокировали правительственный проект в парламенте. В ответ они выдвинули собственное контрпредложение, основанное на выводах Комитета по обороне."
 NW_SWE.2.a: "Хорошо, мы примем проект Комитета по обороне"
 NW_SWE.2.b: "Предложим тогда им принять совместно с этим увеличение пенсий"
 NW_SWE.2.c: "Тогда лучше уйдём в отставку"
 
 NW_SWE.3.t: "Отказ буржуазного большинства"
 NW_SWE.3.d: "Правительство Ханссона предложило хитрый ход – вместе с расширением военного бюджета, они потребовали одновременно принять законопроект об увеличении пенсий. Правые ожидаемо выступили против такого предложения, но это позволило социал-демократам заработать ещё очков репутации перед электоратом на фоне идущих дебатов, выставляя себя как заботящихся о стариках политиках против милитаризма правых."
 NW_SWE.3.a: "Теперь мы должны уйти в отставку, чтобы улучшить свои позиции"
 NW_SWE.3.b: "Мы сделали всё что могли"
 
 NW_SWE.4.t: "Каникулярное правительство"
 NW_SWE.4.desc: "В связи с уходом в отставку премьер-министра Пер Альбин Ханссона, королю необходимо выбрать представителя одной из буржуазных парламентских партий, который сможет сформировать новое правительство. Оно заведомо просуществует недолго так как впереди страну ждут парламентские выборы, поэтому некоторые уже окрестили его «каникулярное правительство»."
 NW_SWE.4.a: "Пусть этим займётся лидер консерваторов, Гёста Багге"
 NW_SWE.4.b: "Это должны сделать либералы под управлением Феликса Хамрина"
 NW_SWE.4.c: ""
 NW_SWE.4.d: "Лидер аграриев, Аксель Перссон-Брамсторп, справится с этим"
 
 NW_SWE.5.t: "Результаты поездки комиссии"
 NW_SWE.5.d: "Наша танковая комиссия посетила различные европейские страны и изучила их танковые войска и производства. Также они выяснили возможности по производству бронетехники для нашей страны и конкретные модели. Теперь нам нужно выбрать какой из этих стран отдать предпочтение."
 NW_SWE.5.a: "Выберем чешских производителей"
 NW_SWE.5.b: "Выберем французских производителей"
 NW_SWE.5.c: "Выберем немецких производителей"
 
 NW_SWE.6.t: "Выборы в нижнюю палату Риксдага"
 NW_SWE.6.d: "Вчера прошли всеобщие выборы в нижнюю палату парламента страны. Завершившийся сегодня подсчёт голосов дал итоговую оценку работы текущего правительства страны. Теперь премьер-министру предстоит принять решение о том, останется ли он и его министры на своих должностях, или они должны уйти в отставку."
 NW_SWE.6.a: "Сохраним старое правительство"
 NW_SWE.6.b: "Уходим в отставку"
 
 NW_SWE.7.t: "Формирование нового правительства"
 NW_SWE.7.desc: "Королю нужно выбрать кому предложить пост премьер-министра. Правительство должно обладать достаточным количеством депутатов в парламенте, чтобы эффективно работать и принимать законопроекты, поэтому возможно нам следует предложить выбрать премьером лидера наиболее популярной партии, или менее популярной, но способной пойти на коалицию с другими фракциями.\n\nОбычно, правые готовы объединиться в единую правую коалицию под руководством одного из лидеров, а социал-демократы могут брать в союзники аграриев или либералов и совсем изредка готовы рассматривать левых радикалов в качестве партнёров по коалиции."
 NW_SWE.7.a: "Социал-демократы должны возглавить кабинет"
 NW_SWE.7.b: "Либералы должны возглавить кабинет"
 NW_SWE.7.c: "Аграрии должны возглавить кабинет"
 NW_SWE.7.d: "Консерваторы должны возглавить кабинет"
 
 NW_SWE.9.t: "Пер Альбин Ханссон умер"
 NW_SWE.9.desc.a: "С самого утра сегодняшнего дня Ханссон жаловался на боль в левой руке, которую он едва мог поднять. Несмотря на боль, Ханссон был в хорошем настроении во время ужина. После кофе Ханссон играл в бридж со своими гостями. Ханссон покинул Операкелларен вскоре после полуночи и, как обычно, сел на трамвай № 12, чтобы добраться домой в свой таунхаус в Ольстене. Выйдя из трамвая на остановке Ольстенсгатан, он упал на землю, у него случился сердечный приступ. Считается, что он умер мгновенно. Свидетели происшествия вызвали полицию и скорую помощь, но, когда они прибыли в больницу Святого Горана, он уже был мёртв. Ханссон будет похоронен на Норра-бегравнингсплацен в Стокгольме."
 NW_SWE.9.desc.b: "$NW_SWE.9.desc.a$\n\nСоциал-демократам необходимо срочно выбрать человека, который заменит Ханссона на посту премьер-министра и самое главное, лидера партии. От этого будет зависеть то, каким курсом будет дальше развиваться левое движение в стране."
 NW_SWE.9.a: "Лидер партии - Эрнст Вигфорсс"
 NW_SWE.9.b: "Ветеран левого крыла - Густав Мёллер"
 NW_SWE.9.c: "Молодой компромиссный кандидат - Таге Эрландер"
 NW_SWE.9.d: "Архитектор Народного дома умер как простой человек"
 
 NW_SWE.10.t: "Консерваторы меняют название"
 NW_SWE.10.d: "Созданный в 1904 году «Всеобщий союз избирателей» изначально задумывался консерваторами не как классическая политическая партия (к партийным структурам тогда относились с предубеждением), а скорее как рыхлая, децентрализованная коалиция и координационный орган для сбора средств и ведения предвыборных кампаний.\n\nК текущему времени шведская политика полностью изменилась: социал-демократы выстроили мощную и дисциплинированную партийную машину. Консерваторам требовалось создать жёсткую общенациональную структуру с чётким партийным билетом, единой программой и централизованным лидерством под руководством своего лидера Гёста Багге.\n\nКроме того, до середины 1930-х годов шведские консерваторы в парламенте были разделены на две самостоятельные группы в зависимости от палаты. В 1935 году эти группы наконец преодолели внутренние разногласия и объединились в единую парламентскую фракцию - «Парламентскую группу правых». Название общенациональной организации, должно было отразить это долгожданное единство на уровне всей страны.\n\nК тому же, историческое название партии «Всеобщий союз избирателей» к сегодняшнему дню устарело и мало что говорит рядовому избирателю. Включение слова «Правые» в название покажет идеологию партии понятной и чёткой."
 NW_SWE.10.a: "Своевременное решение"
 
 NW_SWE.11.t: "Гёста Багге уходит с поста лидера консерваторов"
 NW_SWE.11.d: "Гёста Багге ушёл в отставку с поста лидера Правой партии. Главной причиной ухода стали результаты недавних парламентских выборов. Под руководством Багге консерваторы потеряли значительную часть мест, показав один из худших результатов в своей истории. Члены партии стали требовать обновления руководства. Изначально партийная элита и сам Гёста Багге видели идеальным преемником Мартина Скоглунда (влиятельного политика из Эстергётланда). Однако Скоглунд категорически и наотрез отказался брать на себя лидерство и ответственность за партию, переживающую кризис. После отказа Скоглунда руководство оперативно консолидировалось вокруг кандидатуры Фритьофа Доме. Он представляет умеренное аграрно-землевладельческое крыло партии. Сегодня на партийной конференции кандидатура Доме была официально утверждена без открытого противостояния или раскола."
 NW_SWE.11.a: "Конец карьеры профессора"
 
 NW_SWE.12.t: "Густав Андерссон уходит с поста лидера либералов"
 NW_SWE.12.d: "Густав Андерссон покинул пост главы Народной партии. Считается, что это подготовленный ход партийной элиты, которая понимает, что партия нуждается в обновлении. Левое крыло социал-демократов представило радикальную программу дальнейшего развития страны, которая предполагает сильное вмешательство государства в экономику и элементы социализации. Густав Андерссон, будучи прагматичным и приземленным политиком старой школы, не обладает нужным теоретическим весом для идеологической дуэли. Партии требуется лидер, способный на равных спорить с экономическим теоретиком социал-демократов Эрнстом Вигфорсом. Ему предложили престижный и спокойный пост губернатора его родной провинции Даларна (Коппарберг), что позволило совершить транзит власти мягко и без публичных скандалов. На смену ему приходит молодое светило либералов – Бертиль Улин, учёный-экономист, основатель Стокгольмской экономической школы и ученик Джона Мейнарда Кейнса. В 1934 году Улин был назначен председателем недавно созданной Молодежной лиги Народной партии, в которой он оставался до 1939 года. С 1937 года он все больше сосредотачивался на своей политической роли и теперь готов взять в свои руки руководство всей партией."
 NW_SWE.12.a: "С такими силами либералы могут занять новые высоты"
 
 NW_SWE.15.t: "Правые критикуют законопроект"
 NW_SWE.15.d: "Основные буржуазные партии объединились в своей критике рассматриваемого в Риксдаге законопроекта. Лидеры правых уже отказались принимать его, а либералы скорее находятся в подвешенном состоянии. В конечном счёте нам скорее всего придётся принимать законопроект без их поддержки."
 NW_SWE.15.a: "Этого стоило ожидать"
 
 NW_SWE.16.t: "Левые критикуют правительство"
 NW_SWE.16.d: "Все левые партии Риксдага выступили против рассматриваемого в нём в настоящий момент законопроекта. Они считают, что продвигаемые нашим правительством законы бьют по простым шведам, а сами наши партии являются марионетками крупного капитала, для помощи которого мы и хотим принять этот новый закон."
 NW_SWE.16.a: "Это дешёвый популизм"
 
 NW_SWE.17.t: "День Лидера"
 NW_SWE.17.d: "Сегодня лидер Национал-социалистической рабочей партии Свен Улов Линхольм организовал масштабное мероприятие, которое назвал «Днём Лидера», но фактически оно представляет из себя съезд его партии. Главной площадкой съезда стал зал «Аудиториум» в Стокгольме, располагающийся в районе Норра Банторгет. Это статусное общественное пространство, которое партия арендовала специально для привлечения внимания горожан. Центральным событием дневной программы стала программная лекция самого Линдхольма. В своем выступлении он объявил о «новом курсе», подчеркивая, что движение уходит от слепого копирования немецкого гитлеризма и берет курс на «чисто шведский народный социализм». Колонна шведских нацистов («линдхольмеров») с зажженными факелами выдвинулась от площади Эстермальмсторг и прошла маршем через центральные улицы Стокгольма к месту проведения съезда.\n\nСледующей частью съезда стал спектакль с переодеванием штурмовиков и сменой партийной атрибутики происходил прямо на глазах у участников и приглашенной прессы. Партийным функционерам и штурмовикам из молодежного крыла (Nordisk Ungdom) было приказано прямо на съезде избавиться от коричневых рубашек. Им на смену выдали новые синие рубашки, призванные ассоциироваться со шведским флагом. Со стен зала и знамен были убраны свастики. Вместо них партийцы закрепили эмблемы со снопом Вазы. Линдхольм лично демонстрировал прессе новые значки и флаги, пытаясь доказать «коренное шведское происхождение» своей символики. Очевидцы сообщили, что на съезде жестко контролировалось соблюдение запрета на римский салют. Вместо этого вводилось новое внутреннее приветствие, которое позиционировалось как «староскандинавское».\n\nКроме того, Линдхольм объявил о смене названия партии – теперь она будет называться «Шведское социалистическое собрание». Таким образом, Линдхольм продолжает заигрывать с левыми настроениями в духе своего «более левого нацизма» - похожего на идеи немецких братьев Штрассеров, репрессированных Гитлером в Германии."
 NW_SWE.17.a: "Поможет ли это ему?"
 
 NW_SWE.18.t: "Фуругард распускает свою партию"
 NW_SWE.18.d: "Шведская национал-социалистическая партия была образована 1 октября 1930 года как слияние большого числа ранее существовавших мелких разрозненных фашистских и нацистских движений Швеции в единую федерацию, однако это продолжалось недолго. Её лидером которой был Биргер Фуругард, а его официальным титулом в партии был статус «рикследера». В состав партии также входили молодежная организация «Викингара» и женская организация «Кристина Гилленстиерна». На пике своего могущества в 1933 году партия насчитывала 10 000 членов. Свен Олов Линдхольм был вторым по значимости лицом в партии и редактором журнала «Vår Kamp».\n\nВ 1933 году в партии произошёл крупный раскол. Конфликт между Фуругардом и Линдхольмом тлел с 1932 года. Конфликт возник из-за спора между Линдхольмом (который придерживался несколько более левых взглядов) и Гётеборгским отделением партии (находившимся в руках более консервативных элементов). Фуругард оставался близок к Гётеборгскому отделению и в некоторой степени стал экономически зависим от него. 13 января 1933 года Фуругард исключил Линдхольма и его сторонников из партии после хаотичного заседания Большого совета. В ответ Линдхольм 14 января 1933 года создал свою собственную партию – Национал-социалистическую рабочую партию. Более того, Линдхольм разослал в партийные отделения заявление, обвиняющее Фуругарда в коррупции. Лидер штурмовых отрядов Хеденгрен встал на сторону Линдхольма. Многие молодые члены партии также присоединились к партии Линдхольма.\n\nПосле раскола обе партии конкурировали друг с другом за поддержку и признание как шведского электората, так и своих немецких коллег. В конечном итоге движение Линдхольма укрепило свои позиции как крупнейшее национал-социалистическое движение в Швеции. Прошедшие недавно выборы полностью подтвердили это – партия Фуругарда набрала голосов едва больше чем общая текущая численность партии – 3025 человек по всей стране отдали за неё свой голос.\n\nСегодня, окончательно поверженный и деморализованный Фуругард признал поражение, объявил о роспуске своей партии и призвал своих последователей объединиться с Линдхольмом."
 NW_SWE.18.a: "Бесславный конец"
 
 NW_SWE.19.t: "Слияние правых молодёжных сил"
 NW_SWE.19.d: "Национальный союз Швеции – это политическая организация, основанная в 1915 году в качестве молодёжного крыла консервативной Правой партии. На протяжении 1920-х и начала 1930-х годов организация постепенно смещалась на более радикальные правые позиции, выступая за корпоративизм и пронемецкий внешнеполитический курс. Разногласия по вопросам идеологии привели в 1934 году к официальному разрыву с Правой партией и её преобразованию в самостоятельное политическое движение, ориентированное на националистическую платформу. В 1935 году организация сменила название на Национальный союз Швеции и приняла участие в парламентских выборах 1936 года, однако не смогла получить широкую поддержку избирателей, сохранив позиции лишь как малая правая партия.\n\nДругая важная правая организация, «Национальный союз Новая Швеция», была создана 28 октября 1930 года общественным деятелем Пером Энгдалем после его выхода из Шведской фашистской боевой организации. Базируясь преимущественно в Мальмё, движение формировало собственную идеологическую платформу – «новошведскость», которая сочетала в себе радикальный шведский национализм, антимарксизм, жесткий антикоммунизм и концепцию корпоративизма по образцу итальянской политической модели. Организация сознательно дистанцировалась от копирования германского нацизма и позиционировала себя скорее как элитарный политический клуб, не принимая участия в парламентских выборах. Основным инструментом распространения её идей и консолидации сторонников служила собственная периодическая газета Vägen Framåt («Дорога вперёд»), начавшая регулярно выходить с 1932 года.\n\nСегодня состоялось их официальное слияние. Толчком к объединению стало то, что на последних выборах Национальный союз Швеции выступил неудовлетворительно, а движение Энгдаля не набирало популярности. Обе группы поняли, что поодиночке они обречены на изоляцию. В результате слияния Национальный союз Швеции официально перенял разработанную Энгдалем концепцию «новошведскости». На партийной конференции после объединения была утверждена новую программу, где партия провозгласила себя «корпоративной, новошведской, радикальной, национальной и социалистической» организацией. Руководителем объединения остался консерватор Элмо Линдхольм, однако Пер Энгдаль получил место в исполнительном комитете и ключевой пост вице-председателя союза. Таким образом, они рассчитывают объединить массовость и популярность одного движения с интеллектуальным наполнением другого."
 NW_SWE.19.a: "Посмотрим, к чему это приведёт"
 
 NW_SWE.20.t: "Исключение Чильбума из партии Чильбума"
 NW_SWE.20.d: "В октябре 1929 года в Коммунистической партии Швеции случился очень серьёзный раскол. Основатели и лидеры партии, возглавляемые Карлом Чильбумом и Нильсом Флюгом, выступили против директив Коминтерна о переходе к тактике «класс против класса» и обвинений социал-демократов в «социал-фашизме». \n\nВ результате раскола вся коммунистическая парламентская группа, официальная газета партии «Folkets Dagblad Politiken» и большинство наиболее радикальных членов присоединились к фракции Чильбума-Флюга. До 1934 года отколовшаяся группа использовала то же название, что и старая партия, - Коммунистическая партия, поэтому, чтобы разделить две партии, эта фракция была известна как «Чильбоммаре» (Чильбумцы), в то время как те, кто остался в старой партии, были известны как «Силленаре» («Силленцы», по имени их лидера Хуго Силлена).\n\nВ 1934 году к ним присоединилась отколовшаяся от социал-демократов группа из Гётеборга во главе с Альбином Стрёмом, после чего объединённая партия официально переименовалась в Социалистическую партию и превзошла по народной поддержке просоветское крыло. Программные установки партии упирали на антисталинизм и самостоятельный путь к социализму.\n\nСегодня партию всё-таки настиг раскол – генеральный секретарь партии, Нильс Флюг, не выдержал конкуренции с остальными популярными среди рабочих лидерами, в первую очередь с Карлом Чильбумом, и официально исключил его из партии, назвав его «ренегатом, капитулировавшим перед буржуазной социал-демократией». Известно, что ещё полгода назад Флюг сместил Чильбума также с поста главного редактора партийной газеты.\n\nВ качестве протеста против этого исключения, из Социалистической партии вышли другие известные её представители: Эвальд Хёглунд и Туре Нерман. Вслед за ними демонстративно последовали тысячи сознательных рабочих и целые региональные ячейки партии, особенно в Стокгольме."
 NW_SWE.20.a: "Печальный конец"
 
 NW_SWE.21.t: "Карл Чильбум вернулся к социал-демократам"
 NW_SWE.21.d: "Изгнанные лидеры Социалистической партии не стали создавать новую партию. Сегодня Карл Чильбум официально подал заявление и вернулся в Социал-демократическую партию Швеции. Вышел из неё он в 1917 году, выступив создателем Коммунистической партии."
 NW_SWE.21.a: "Хорошее подкрепление для социал-демократов"
 
 NW_SWE.22.t: "Обращение шведской Социалистической партии"
 NW_SWE.22.d: "В 1929 году в Коммунистической партии Швеции случился серьёзный раскол между сторонниками и противниками слепого следования указаниям Москвы. Тогда шведские коммунисты разошлись на две партии с одинаковыми названиями, и противники Москвы первоначально даже имели преимущество на выборах. Однако, к текущим дням из-за внутренних конфликтов их партия, успевшая сменить название на Социалистическую, сильно потеряла в числе сторонников. Ситуация стала настолько критической, что её лидер, Нильс Флюг, ярый антисталинист, обратился к нам с просьбой о финансовой поддержке в обмен на готовность лоббировать наши интересы в шведском парламенте."
 NW_SWE.22.a: "Мы поможем им, хоть это и звучит безумно"
 NW_SWE.22.b: "Мы не собираемся поддерживать коммунистов"
 
 NW_SWE.23.t: "Раскол Социалистической партии"
 NW_SWE.23.d: "Недавние изменения в риторике Социалистической партии говорят о серьёзных внутренних противоречиях внутри неё. Нильс Флюг в своей антимосковской критике зашёл настолько далеко, что стал призывать к официальному запрету прокоминтерновской Коммунистической партии Швеции. Поговаривают также, что в последнее время он стал получать деньги из Германии – пойти на этот шаг ему пришлось из-за катастрофического падения популярности и количества членов партии.\n\nНа этом фоне от партии отделилась фракция из Гётеборга во главе с Альбином Стрёмом. Сегодня он созвал в городе партийную конференцию, где объявил об образовании новой «Левой Социалистической партии». К нему присоединились его преимущественно местные сторонники вместе с их еженедельной газетой «Arbetarposten»."
 NW_SWE.23.a: "Кажется, что Флюгу не помогло финансирование от немцев"
 
 NW_SWE.24.t: "Смерть Нильса Флюга"
 NW_SWE.24.d.a: "Сегодня стало известно о смерти Нильса Флюга – основателя и лидера Социалистической партии. Он умер от тромба в сердце. Проблемы с сердечной системой начались у него ещё с 1941 года, но попытки лечения не помогли."
 NW_SWE.24.d.b: "$NW_SWE.24.d.a$\n\nТеперь его партию возглавит Альбин Стрём – лидер Гётеборского отделения, который отличается меньшей тенденциозностью в отношении Москвы и выступает за действительное истинное построение независимого социализма в Швеции, в отличие от Флюга и его окружения, которое в последние годы стало искать поддержки за границей у стран, которые находятся в конфликте с СССР."
 NW_SWE.24.d.c: "$NW_SWE.24.d.a$\n\nТеперь его партию возглавит Агатон Блюм – его ближайший сторонник, пришедший с ним в партию ещё из Коммунистической партии Швеции, но который также, как и Флюг вступил на пронацистские позиции. В подтверждение этому, на экстренном партийном съезде Блюм сообщил о том, что партия меняет своё название – теперь она будет известна как Шведская Социалистическая партия."
 NW_SWE.24.a: "Скорее всего и партии после смерти Флюга скоро придёт конец"
 
 NW_SWE.25.t: "Критика обороноспособности"
 NW_SWE.25.d: "На фоне роста международной напряжённости и внешних угроз для нашей страны, правые партии продолжили свою критику предыдущих правительств, и конкретно социал-демократов, так как именно они громче всех выступали за разоружение страны и поддерживали пацифистские настроение так долго и упорно. Они считают, что страна перешагнула черту в этом устремлении, в результате чего слишком сильно отстала в создании современной оборонной промышленности, что как видно из последних новостей становится главным фактором способности страны защитить себя."
 NW_SWE.25.a: "Тут они правы"
 
 NW_SWE.26.t: "Финляндия в опасности"
 NW_SWE.26.d: "Финляндия подверглась нападению со стороны Советского Союза. Эта страна более 600 лет была частью нашего государства, и когда она снова смогла добиться независимости после крушения монархии в России, мы активно помогали им в этом. Более того, в обществе продолжает сохраняться страх перед коммунизмом и российской угрозой. Всё это создало почву для существования широкого общественного мнения в пользу участия Швеции в советско-финской войне. На собрании граждан в Упсале представители всех партий, кроме коммунистов, объединились для поддержки шведской интервенции. Большая часть высшего офицерского корпуса также выступает за прямую военную помощь, так как считает, что лучше обороняться от возможной дальнейшей советской интервенции на территории Финляндии, чем на нашей собственной. Многие считают, что именно Швеция может стать следующей целью Москвы."
 NW_SWE.26.a: "Мы не будем участвовать в советско-финской войне"
 NW_SWE.26.b: "Мы поддержим наших финских братьев"
 
 NW_SWE.27.t: "Требование национального правительства"
 NW_SWE.27.d: "На фоне отказа правительства и лично премьер-министра от помощи Финляндии в войне, многие общественные организации оказались возмущены. Правые силы стали объединяться с целью добиться от правительства столь опасной и резкой реакции. Сегодня это вылилось и в парламентские дебаты. Группа депутатов собирается поднять вотум о доверии правительству. Они рассчитывают добиться его отставки и замены на более интервенционистскую силу."
 NW_SWE.27.a: "У нас хватит сил в этом голосовании"
 
 NW_SWE.28.t: "Правительству объявлен вотум недоверия"
 NW_SWE.28.d: "Как и предсказывалось многими аналитиками, в ходе голосования в Риксдаге о вотуме недоверия текущему правительству объединились представители очень разных партий: все депутаты-консерваторы, ультраправые депутаты, а самое главное – почти половина депутатов социал-демократов и депутаты-социалисты перешли на позиции интервенционизма. В результате этого, текущему правительству объявлен вотум недоверия, а значит оно ожидается в скором времени уйдёт в отставку."
 NW_SWE.28.a: "Эти безумцы тянут нас в войну!"
 
 NW_SWE.29.t: "Правительство удержалось"
 NW_SWE.29.d: "В ходе голосования в Риксдаге о вотуме недоверия текущему правительству объединились представители очень разных партий: все депутаты-консерваторы, ультраправые депутаты, а самое главное – почти половина депутатов социал-демократов и депутаты-социалисты перешли на позиции интервенционизма. Однако, даже всего этого не хватило для того, чтобы набрать необходимое число голосов для объявления правительству вотума."
 NW_SWE.29.a: "Премьер-министр справился, но не учитывать мнения этих людей нельзя"
 
 NW_SWE.30.t: "Король выбирает лидера национального правительства"
 NW_SWE.30.d: "Так как предыдущему правительству пришлось подать в отставку, то теперь королю предстоит выбрать нового человека на роль премьер-министра. В текущей чрезвычайной ситуации это будет выбор, который может стать решающим для независимости страны. В качестве кандидатур рассматривается два человека."
 NW_SWE.30.a: "Социал-демократ Торстен Нотин – идеальный кандидат"
 NW_SWE.30.b: "Беспартийный дипломат Кристиан Гюнтер – идеальный кандидат"
 
 NW_SWE.31.t: "Предвыборная агитация"
 NW_SWE.31.desc: "Приближаются выборы, и каждая из партий начинает вести свою предвыборную кампанию. Нам нужно выбрать какой стратегии в агитации будет придерживаться наша партия на этих выборах."
 NW_SWE.31.a: "Будем рассказывать о наших планах построения Народного дома"
 NW_SWE.31.b: "Будем рассказывать о нашей экономической политике, которая помогла справиться с Великой депрессией"
 NW_SWE.31.c: "Сделаем упор на предполагаемые планы левых по социализации бизнеса"
 NW_SWE.31.d: "Сделаем упор на необходимость защиты нашей национальной идентичности"
 NW_SWE.31.e: "Сделаем упор на необходимость обеспечить безопасность и защиту нашей страны"
 NW_SWE.31.f: "Сделаем упор на угрозу установления диктатуры в стране"
 NW_SWE.31.g: "Сделаем упор на церковь и христианскую веру"
 
 NW_SWE.32.t: "Начало тяжёлых переговоров"
 NW_SWE.32.d: "В первой половине 1930-х годов Швецию сотрясали забастовки, блокировавшие порты и заводы. В 1934 году правительство назначило специальную «Комиссию по трудовому миру» (Mammututredningen), которая в 1935 году подготовила доклад. В Риксдаге начались активные дебаты о принятии законов, которые бы законодательно запретили забастовки в ключевых секторах экономики и ограничили права профсоюзов, но и угрожали внедрению государством множества жёстких правил для бизнеса.\n\nЭтот вариант развития событий не устроил никого. Профсоюзы панически испугались потерять право на забастовку и автономию. Работодатели же не хотели, чтобы государство вмешивалось в их бизнес и диктовало условия труда сверху. Обе группы согласились пойти на компромиссные переговоры друг с другом, исключая прямое вмешательство государства.\n\nПервая встреча делегаций состоялась на этой неделе. Стороны сразу договорились уйти от обсуждения конкретных зарплат (это завело бы переговоры в тупик) и сосредоточиться на общих правилах игры – механизмах разрешения конфликтов. Была создана совместная рабочая группа – Комитет по рынку труда (Arbetsmarknadskommitten). Сторону профсоюзов представляет Август Линдберг – председатель Центрального объединения профсоюзов, а от работодателей за стол переговоров сел Густав Сёдерлунд – глава Конфедерации работодателей.\n\nОни поняли, что в Стокгольме, под прицелом журналистов и радикальных крыльев своих же организаций, договориться не удастся. Для работы требуется уединенное место. Комитет выбрал для встреч респектабельный Гранд-отель в Сальтшёбадене. Считается, что процесс переговоров будет не быстрым."
 NW_SWE.32.a: "Будем ожидать исхода переговоров"
 
 NW_SWE.33.t: "Сальтшёбаденское соглашение"
 NW_SWE.33.d: "На протяжении более чем двух лет шли переговоры между представителями рабочих и работодателей в роскошном отеле в курортном местечке Сальтшёбадене. Переговоры проходили в подчеркнуто уважительном, прагматичном и даже джентльменском ключе, что получило название «Дух Сальтшёбадена». Консультации строились по жесткому графику: днём шли тяжелые, изнурительные дискуссии по пунктам – вечером делегаты вместе ужинали и пили кофе. Это помогло разрушить лёд многолетней классовой вражды и увидеть друг в друге равных партнёров.\n\nПереговоры едва не сорвались несколько раз из-за двух фундаментальных вопросов. Первый это так называемый «параграф 32», обсуждающий право на увольнение. Работодатели из SAF намертво стояли за свое историческое право единолично нанимать, увольнять рабочих и распределять работу. Профсоюзы требовали защиты от произвола. LO согласилось признать за владельцами право управлять производством, но SAF взамен обязалось жестко регламентировать процедуру увольнений (вводить обязательное предварительное уведомление и объяснение причин).\n\nВторое это ограничение забастовок и защита третьих лиц. Работодатели требовали полного запрета забастовок, которые вредят обществу (например, в сфере медицины, пожарной охраны или транспорта). Профсоюзы видели в этом покушение на их главное оружие. Стороны договорились создать совместный орган, который в случае угрозы общественным интересам будет выступать арбитром, блокируя радикальные действия как рабочих (забастовки), так и предпринимателей (локауты)." 
 NW_SWE.33.a: "Что в итоге решили?"
 
 NW_SWE.34.t: "Недовольство левого крыла"
 NW_SWE.34.d: "Подписание Сальтшёбаденского соглашения вызвало волну жесткой критики со стороны радикального крыла шведского рабочего движения. Для левых социалистов, коммунистов и синдикалистов этот документ выглядит не как триумф, а как капитуляция перед буржуазией и добровольный отказ от классовой борьбы. Главными критиками выступили две силы: синдикалистский профсоюз SAC (Центральная организация рабочих Швеции) и левое крыло внутри самого LO (Центрального объединения профсоюзов).\n\nБольше всего возмущения вызвало то, что руководство LO официально признало так называемый «Параграф 32» устава Предпринимательского союза (SAF). Этот пункт закреплял за работодателем абсолютное право единолично управлять производством, распределять работу, нанимать и увольнять персонал. Левые считают, что рабочие должны бороться за рабочий контроль на фабриках и за индустриальную демократию.\n\nСальтшёбаденское соглашение вводит сложную многоступенчатую систему обязательных переговоров и арбитража, прежде чем рабочие имели право остановить работу. Особо жестко запрещаются экономические санкции против третьих лиц и забастовки в «социально важных» секторах. Для анархо-синдикалистов прямая забастовка на рабочем месте (без санкции сверху) была главным инструментом давления и проявлением рабочей солидарности. Новый договор фактически ставит несогласованные забастовки вне закона.\n\nЛевое крыло также указывает на то, что Сальтшёбаден закрепил жесткую централизацию власти внутри профсоюзов. Вся власть переходила от местных комитетов на фабриках к высшему совету LO в Стокгольме. Это было необходимо руководству LO для того, чтобы «продавить» необходимость заключения самого соглашения, так как некоторые местные ячейки отказывались подписывать его."
 NW_SWE.34.a: "Возможно, всё не так радужно, как кажется"
 
 NW_SWE.35.t: "Конфликт между профсоюзами"
 NW_SWE.35.d: "Последнее время реформистские профсоюзы (то есть те, которые связаны с LO – Центральным объединением профсоюзов) всё чаще стремятся заключать соглашения, согласно которым компании-работодатели обязывались нанимать только работников, аффилированных с реформистским профсоюзом. Работники, выбравшие другую профсоюзную организацию, должны быть уволены. В трудовой суд в Стокгольме, предназначенный для разрешения трудовых споров, поступила жалоба на эту ситуацию, и хотя это может показаться явным нарушением шведского законодательства об ассоциациях, мы должны принять решение, поддержать реформистские профсоюзы или сохранить право работников и работодателей на свободное заключение соглашений без вмешательства профсоюзного руководства."
 NW_SWE.35.a: "Мы сохраним независимость и беспристрастность в этом вопросе"
 NW_SWE.35.b: "Мы поддержим профсоюзы, хоть это возможно и истолкует закон в неправильном ключе"
 
 NW_SWE.36.t: "Основные принципы соглашения"
 NW_SWE.36.d: "В итоге, после двух с половиной лет изматывающей юридической и дипломатической работы сегодня текст соглашения был окончательно утверждён и подписан в Сальтшёбадене. Документ состоит из пяти основных глав, которые детально прописывают:\n\n1.	Порядок работы постоянного Комитета по рынку труда.\n\n2.	Процедуру ведения переговоров до объявления любых трудовых споров.\n\n3.	Правила увольнения и сокращения персонала.\n\n4.	Запрет на экономические санкции против третьих лиц (не участвующих в конфликте).\n\n5.	Защиту важнейших общественных функций (коммунальные службы, медицина)."
 NW_SWE.36.a: "Поднимем бокалы!"
 
 NW_SWE.37.t: "Шведская линия"
 NW_SWE.37.d: "Сегодня в Стокгольме были издана брошюра «Шведская линия». Её авторами являются Пер Г. Андреен, Арвид Фредборг, Торвальд Т.сон Хёйер, Т. Оке Лейсснер, Пер Гуннар Нордин и Гуннар Унгер. Все авторы брошюры принадлежат к молодёжным политическом организациям. Несколько авторов были членами правонационалистической Шведской национальной лиги. Основной мотив брошюры призывает молодежь вступать в правые партии и голосовать за них на выборах.\n\nТаким образом она знаменует важнейший переломный момент в мировоззрении молодых шведских консерваторов, которые до этого заигрывали с правым радикализмом в кружках вроде Svensk Ungdom. Теперь они избавились от своих антипарламентских настроений на фоне внешней угрозы. В брошюре авторы выступают против тех, кто желает присоединиться к линии Германии или линии Советской России, отдавая предпочтение отдельной шведской линии – отсюда и название брошюры. Авторы по очереди объясняют свои причины дистанцирования от двух великих держав, после чего излагают свои мысли о том, что повлечет за собой отдельная шведская линия.\n\nВ статье содержалась резкая критика шведского разоружения, которое стало результатом оборонного решения 1925 года. Критика премьер-министра Пера Альбина Ханссона была суровой: «Премьер-министр, с другой стороны, посчитал себя вправе заявить, что он, со своей стороны, не сожалеет о своём участии в 1925 году. По этому поводу, а также по его словам осенью 1939 года: „наша готовность хороша“, потомки вынесут свой вердикт»."
 NW_SWE.37.a: "Это база"
 
 NW_SWE.38.t: "Внешние вопросы"
 NW_SWE.38.d: "Основной внешнеполитический тезис документа заключается в том, что свободный скандинавский регион является первостепенной целью Швеции («Балтийское море и скандинавский регион – это жизненное пространство Швеции»). Особо подчёркивается требование прекращения немецкой оккупации Норвегии («Освобождение Норвегии и её политическое и военное восстановление – вопрос жизни и смерти для нас»), а также давление Советского Союза на Финляндию («После нашей собственной свободы свобода Финляндии – наша главная внешнеполитическая цель»).\n\nЭта позиция против нацистской и коммунистической агрессии также отражается во внутриполитических требованиях о мерах против шведских сторонников соответствующей идеологии: «Даже с учётом возможных внешнеполитических трудностей нельзя избежать требования роспуска Коммунистической партии. В равной степени необходимо принять меры против шведских национал-социалистов». В последнем случае, однако, было высказано предупреждение против «одной расчески всех, кто находится правее правых».\n\nВ брошюре мало говорится о последствиях войны за пределами скандинавских стран. Авторы сожалели о сложившейся ситуации и подчеркивали, что Швеция традиционно поддерживала хорошие отношения как с Германией, так и с Великобританией: «В экономическом и политическом плане для нашего народа крайне важно, чтобы хорошие отношения, существовавшие между нами и Англией на протяжении веков, сохранялись»."
 NW_SWE.38.a: "Это рационально"
 
 NW_SWE.39.t: "Внутренние вопросы"
 NW_SWE.39.d: "После раздела, посвященного внешней политике, обсуждались вопросы обороны, демографии, экономики и социальных аспектов, рассматриваемые на фоне текущей мировой ситуации. В главе книги, посвященной так называемой проблеме народонаселения, также представлены размышления о расовой гигиене, а также об антисемитских тенденциях:\n\n«Тесно связаны с демографическим вопросом вопросы расовой гигиены и иммиграции. На наш взгляд, нет оснований отрицать необходимость разумной расовой политики из-за обескураживающих примеров за рубежом. Например, для нас важно разобраться с проблемой воспроизводства неполноценных элементов, что особенно заметно в наших психиатрических больницах и лечебницах для душевнобольных. Кроме того, подавляющее большинство молодых шведов – и мы не исключение – считают однородный состав нашего населения неотъемлемой ценностью. Попытки массового трудоустройства еврейских беженцев в качестве специалистов в нашей стране вызвали большое раздражение и могут также создать конфликты в будущем. Проблема иммиграции полностью зависит от демографического вопроса. Для нас важно обеспечить отсутствие необходимости в иммиграции.»\n\nНаконец, была подчеркнута ответственность молодежи, в том числе в форме требования снизить избирательный возраст до 21 года и призыва ко всем принять участие в выборах во вторую палату парламента в 1940 году («На осенних выборах те, кто имеет право голоса, не могут сидеть дома»). Была подчеркнута важность высокой явки избирателей как символической ценности шведской демократии и свободы:\n\n«Если явка избирателей резко снизится, это будет, с одной стороны, усилением антигосударственных групп, а с другой – значительным ослаблением внешнеполитической позиции Швеции. Тогда иностранные державы смогут заявить, что шведское правительство представляет лишь меньшинство шведского народа, и что этот народ на самом деле безразличен к своей судьбе»."
 NW_SWE.39.a: "Патриотическая позиция"
 
 NW_SWE.40.t: "Приём брошюры"
 NW_SWE.40.d: "Отдельно было подчеркнуто, что шведская свобода и народное представительство – это древние исторические традиции, уходящие корнями в Средневековье, а не просто «либеральное изобретение». Они призвали защищать шведский уклад жизни. Манифест провозгласил верность христианской морали и принципу верховенства права (lagbunden frihet – «законная свобода»).\n\nБрошюра была тепло принята как консервативной, так и либеральной прессой. Либеральная газета Dagens Nyheter описывает брошюру как движимую «искренней любовью к родине и жгучим желанием внести свой вклад в лучшую и, прежде всего, более сильную Швецию». Другая либеральная газета Upsala Nya Tidning приветствует тот факт, что брошюра ставит шведское наследие превыше всего.\n\nАвторы манифеста также планируют начать издавать постоянный печатный орган своего движения, который получит название в честь брошюры."
 NW_SWE.40.a: "Молодые консерваторы вернулись назад"
 
 NW_SWE.41.t: "Призыв к разуму"
 NW_SWE.41.d: "Сегодня в Стокгольме состоялась презентация книги промышленника Акселя Вернер-Грена «Призыв к гражданам». Аксель Веннер-Грен приурочил выход книги к своей масштабной общественной кампании. Накануне публикации, в первой половине ноября, он активно выступал с докладами, продвигая свои идеи «северного сотрудничества». Книга была напечатана издательством Bonniers и моментально привлекла внимание прессы из-за статуса автора.\n\nОна представляет собой общественно-политический манифест. В ней основатель компании Electrolux и один из богатейших людей планеты делится взглядами на преодоление мирового кризиса, угрозу новой войны и будущее капитализма. Веннер-Грен пишет, что наука и новые технологии способны полностью победить бедность и создать материальное изобилие для всего человечества. Веннер-Грен критикует как радикальный социализм, так и дикий капитализм. Он призывает к сотрудничеству между рабочими и промышленниками ради общего блага. Одной из главных целей манифеста было сплочение стран Северной Европы (Швеции, Дании, Норвегии, Финляндии и Исландии) для сохранения нейтралитета на фоне растущей агрессии в Европе. Книга написана в гуманистическом стиле и осуждает тоталитаризм, призывая мировых лидеров сесть за стол переговоров.\n\nДля многих шведов книга стала сюрпризом: жесткий, прагматичный и невероятно успешный капиталист вдруг выступил в роли гуманиста и миротворца. Веннер-Грен обещает также выпустить в ближайшее время перевод книги на английский язык для англоязычных читателей."
 NW_SWE.41.a: "А кто он такой?"
 
 NW_SWE.42.t: "Аксель Веннер-Грен"
 NW_SWE.42.d: "Аксель Веннер-Грен является одним из самых богатых, влиятельных и известных промышленных магнатов мира. Родившись в семье шведского фермера и торговца, он получил коммерческое образование в Германии и благодаря феноменальному таланту продавца построил глобальную бизнес-империю. Его главным триумфом стало создание и агрессивное международное продвижение концерна Electrolux, который совершил революцию в быту, сделав абсорбционные холодильники и массовые пылесосы стандартами домашних хозяйств по всему земному шару.\n\nК концу 1930-х годов Веннер-Грен уже отошёл от операционного руководства своей компанией, и приобрёл крупный пакет акций оружейного гиганта Bofors. К 1937 году он является крупнейшим частным землевладельцем в Швеции, владельцем роскошной мега-яхты Southern Cross и филантропом, пожертвовавшим миллионы крон на создание Стокгольмского института Веннер-Грена, что обеспечило ему авторитет и прямой доступ в высшие политические круги Европы и США, которые он и пытается использовать для предотвращения надвигающейся мировой войны. Так, известно, что в прошлом году его принимал у себя американский президент Франклин Делано Рузвельт.\n\nСейчас же он стал заниматься поддержкой различных политиков, преимущественно правого и ультраправого толка дома, в Швеции. Так, он финансирует старую консервативную газету Nya Dagligt Allehanda. Также он финансирует молодёжный журнал «Svensk Ungdom», который является органом одноименного объединения и который через своего редактора Гуннара Унгера ведёт пропаганду против парламентской демократии и отстаивает «национал-радикализм»."
 NW_SWE.42.a: "Будем надеяться, что это не сильно захватит умы людей"
 
 
 NW_SWE_news.1.t: "[GetNewsHeadline]Швеция приняла новый Закон об обороне"
 NW_SWE_news.1.d: "Риксдаг Швеции после долгих дискуссий всё-таки принял новый законопроект об обороне. Он стал результатом почти шестилетней работы Комитета по обороне. Предыдущий закон об обороне 1925 года сильно урезал финансирование армии и флота на фоне разговоров о пацифизме и веры в Лигу Наций. Современные условия же диктуют даже нейтральному скандинавскому государству необходимость самостоятельно заботиться о своей безопасности. В первую очередь, за его принятие выступали правые партии и военные, а социал-демократы пытались добиться финансирования своих социальных программ."
 NW_SWE_news.1.a: "Швеция тоже теперь перевооружается"
 
 
