 SWE_progerman_elites: "Пронемецкие элиты"
 SWE_progerman_elites_desc: "Среди шведских элит с начала века были распространены германофильские настроения. Многие представители аристократии породнились с немецкими монаршими домами, а также многие шведские компании имеют бизнес-интересы в Германии. Приход к власти нацистов первоначально приветствовался правыми силами Швеции, но спустя время политика нацистов стала вызывать вопросы и скорее раздражение и неудобства для ведения торговых и дипломатических отношений с Германией."
 SWE_defense_law: "Закон об обороне 1925 года"
 SWE_defense_law_desc: "Пацифистские настроения 1920-х годов привели к принятию сильно урезанного военного бюджета страны в 1925 году. Он предполагал радикальное сокращение расходов как на армию, так и на флот. Это привело к сильному отставанию в последние годы в развитии военного дела в Швеции. Начиная с конца 20-х годов военные и правые политики борются за увеличение затрат на оборону, так как считают это необходимым для безопасности страны в условиях враждебного окружения."
