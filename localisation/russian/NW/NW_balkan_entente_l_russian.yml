l_russian:

 NW_balkan_entente_category: "Балканская Антанта"
 NW_balkan_entente_category_desc: "Для сохранения статус-кво в Балканском регионе усилиями Франции из государств полуострова была создана Балканская Антанта — оборонительный союз Югославии, Румынии, Турции и Греции. Согласно договору, участники обязуются:\n\n— Не предпринимать агрессивных действий против других членов союза;\n— Оказать военную помощь, если один из участников подвергнется нападению со стороны балканского государства, не входящего в альянс;\n— Прийти на помощь союзнику в случае агрессии против него со стороны любой другой европейской державы;\n\nФормат исполнения обязательств каждая страна определяет самостоятельно. Чем выше уровень взаимного доверия между членами альянса, тем выше вероятность, что они выступят единым фронтом. Идеологические разногласия также могут повлиять на итоговое решение. Нарушение союзнического долга, как и агрессивная риторика против соседей, влечёт за собой немедленное исключение из рядов Балканской Антанты."
 NW_form_a_military_alliance: "Сформировать военный альянс"

 NW_balkan_entente_modifier: "$NW_balkan_entente_category$"
 NW_balkan_entente_modifier_desc: "Оборонительный союз Балканской Антанты был создан, чтобы сохранить статус-кво на Балканском полуострове, также известном как «пороховая бочка Европы»."
 BE_expansion_of_the_merchant_fleet_idea: "Расширение торгового флота"

 ###FOCUSES###
 BE_strengthen_the_balkan_entente: "Укрепить Балканскую Антанту"
 BE_strengthen_the_balkan_entente_desc: "На данный момент Балканская Антанта — не более чем фикция. Вряд ли кто-то из государств-членов станет выполнять текущие договорённости, не говоря уже о дальнейшем сближении. Чтобы исправить это положение, мы должны первыми проявить инициативу и сплотить союзников."
 BE_invite_bulgaria: "Пригласить Болгарию"
 BE_invite_bulgaria_desc: "Изначально Болгария отказалась вступать в Балканскую Антанту, поскольку находилась в сильной зависимости от Германии — державы, против которой во многом и создавался этот оборонительный союз. Теперь, когда София избавилась от иностранного влияния, мы можем вновь направить ей приглашение." BE_use_the_experience_of_the_bulgarian_military_industrial_complex: "Использовать опыт болгарского ВПК" BE_use_the_experience_of_the_bulgarian_military_industrial_complex_desc: "Несмотря на последствия Первой мировой войны, болгарский ВПК по-прежнему остаётся одним из лучших на Балканском полуострове. Очевидно, вся Балканская Антанта должна воспользоваться этим опытом, чтобы развить собственную военную промышленность."
 BE_invite_albania: "Пригласить Албанию"
 BE_invite_albania_desc: "Изначально Албания отказалась вступать в Балканскую Антанту, поскольку находилась в сильной зависимости от Италии — державы, против которой во многом и создавался этот оборонительный союз. Теперь, когда Тирана избавилась от иностранного влияния, мы можем вновь направить ей приглашение."
 BE_albanian_oil_exports: "Развитие албанского нефтеэкспорта"
 BE_albanian_oil_exports_desc: "Немногое, чем обладает Албания — это нефть; другие важные ресурсы в стране практически отсутствуют. Нарастив объёмы её добычи и наладив экспорт, мы сможем обеспечить потребности союзников в обмен на экономическую помощь."
 BE_military_conventions_of_the_balkan_pact: "Военные конвенции Балканского пакта"
 BE_military_conventions_of_the_balkan_pact_desc: "Ещё при подписании Балканского пакта государства-участники согласно секретным протоколам обязались разработать общие военные конвенции в течение первых шести месяцев, однако это условие так и не было выполнено. Настало время вернуться к прежним договорённостям."
 BE_joint_military_exercises: "Совместные военные учения"
 BE_joint_military_exercises_desc: "Мы начнём унификацию стандартов военной подготовки. Совместными усилиями мы устраним различия между армиями стран пакта, создав прочный фундамент для объединённых вооружённых сил Балканской Антанты."
 BE_export_of_serbian_steel: "Развитие сербского сталеэкспорта"
 BE_export_of_serbian_steel_desc: "Запасы железной руды и мощности металлургической промышленности Сербии достаточно обширны, чтобы наладить поставки высококачественной стали государствам-членам союза в обмен на критически важное сырьё."
 BE_economic_cooperation_in_the_balkans: "Экономическое сотрудничество на Балканах"
 BE_economic_cooperation_in_the_balkans_desc: "Пришло время укрепить хозяйственные связи внутри нашего альянса. Согласование торговой политики и создание совместных производств позволят снизить издержки и защитить наши рынки от внешнего экономического давления великих держав."
 BE_integration_of_our_infrastructure: "Интеграция общей инфраструктуры"
 BE_integration_of_our_infrastructure_desc: "Международная напряжённость неуклонно растёт, а Балканы вновь оказываются в центре геополитических интересов мировых держав. Обычного экономического и военного партнёрства уже недостаточно. Мы обязаны полностью интегрировать транспортные и логистические сети, отменить внутренние таможенные пошлины и объединить стратегические ресурсы союза."
 
 BE_power_of_turkish_industry: "Мощь турецкой промышленности"
 BE_power_of_turkish_industry_desc: "Турецкая промышленность обладает наибольшим потенциалом среди всех государств Балканской Антанты. Мы должны оказать содействие союзникам в индустриализации, поделившись передовыми технологиями и производственным опытом."
 BE_export_of_turkish_chrome: "Развитие турецкого хромэкспорта"
 BE_export_of_turkish_chrome_desc: "Турция является одним из крупнейших мировых поставщиков высококачественной хромовой руды — критически важного компонента для производства танковой брони, артиллерийских орудий и легированной стали. Налаживание бесперебойных поставок этого стратегического сырья внутри альянса позволит резко повысить качество вооружения всех армий Балканской Антанты."
 BE_expansion_of_the_merchant_fleet: "Развитие торгового флота"
 BE_expansion_of_the_merchant_fleet_desc: "Греческий торговый флот — один из крупнейших в мире, а история нашей страны полна славных морских побед. Мы должны распространить наш богатый опыт мореходства и кораблестроения на все государства Антанты."
 BE_introduce_an_internationalist_experience: "Использовать опыт многонационального государства"
 BE_introduce_an_internationalist_experience_desc: "Югославия объединяет множество наций, этносов и культур, сосуществующих в едином бурлящем котле. Нам необходимо использовать этот уникальный опыт межэтнического взаимодействия, чтобы укрепить взаимопонимание между всеми государствами Балканской Антанты."
 BE_romanian_mountain_training: "Румынский опыт горной подготовки"
 BE_romanian_mountain_training_desc: "Карпатские горы занимают значительную часть Румынии, благодаря чему её армия накопила колоссальный опыт ведения боевых действий в высокогорье. Передача этих уникальных тактических навыков повысит боеспособность всех армий альянса."
 BE_romanian_oil_refining: "Румынская нефтепереработка"
 BE_romanian_oil_refining_desc: "Румыния обладает богатейшими запасами черного золота на Балканах, благодаря чему её технологии нефтепереработки ушли далеко вперёд (в частности, комплекс в Плоешти). Создание совместных научно-исследовательских групп позволит модернизировать химическую промышленность всего альянса."
 BE_united_defense_of_the_balkans: "Объединённая оборона Балкан"
 BE_united_defense_of_the_balkans_desc: "Мы обязаны сплотиться, чтобы защитить Балканский полуостров от любого внешнего агрессора и не позволить чуждым державам навязывать нам свои правила."
 BE_balkan_scientific_cooperation: "Балканское научное сотрудничество"
 BE_balkan_scientific_cooperation_desc: "После заключения полноценного военного союза следующим логичным шагом станет объединение нашего научно-исследовательского потенциала."

 ###EVENTS###
 NW_balkan_entente.0.t: "Нападение на Балканскую Антанту"
 NW_balkan_entente.0.d: "Границу государства [balkan_entente_defender.GetName] пересекли [balkan_entente_agressor.GetAdjective] войска. Государство [balkan_entente_agressor.GetName] проигнорировало её членство в Балканской Антанте, и мы, как страна-участница, обязаны соответствующе отреагировать на этот выпад. По взятым на себя обязательствам мы должны объявить войну этой стране и поддержать нашего союзника."
 NW_balkan_entente.0.a: "Мы честно исполним свои обязательства!"
 NW_balkan_entente.0.b: "Это не наша война, нам ни к чему этот риск..."
 
 NW_balkan_entente.1.t: "Укрепление Балканской Антанты"
 NW_balkan_entente.1.d: "Государство [FROM.GetName] выступило с предложением укрепить отношения не только между нами, но и всеми странами, подписавшими оборонительный союз Балканской Антанты. Это не только позволит подтвердить взятые странами-участниками обязательства, но и откроет дорогу к дальнейшему укреплению пакта."
 NW_balkan_entente.1.a: "Это выгодное предложение"
 NW_balkan_entente.1.b: "Мы не будем идти навстречу, но сохраним участие"
 
 NW_balkan_entente.2.t: "Балканская Антанта предлагает пополнить их ряды"
 NW_balkan_entente.2.d.a: "К нам пришло приглашение о вступление в ряды оборонительного союза Балканской Антанты. Теперь, когда мы можем не оглядываться на мнение Германии, то можем сами решать, способны ли мы жать руку вчерашним недругам, или стоит её оттолкнуть, пока они нас не предали?"
 NW_balkan_entente.2.d.b: "К нам пришло приглашение о вступление в ряды оборонительного союза Балканской Антанты. Теперь, когда мы можем не оглядываться на мнение Италии, то можем сами решать, способны ли мы жать руку вчерашним недругам, или стоит её оттолкнуть, пока они нас не предали?"
 NW_balkan_entente.2.a: "Мы нашли себе новых союзников!"
 NW_balkan_entente.2.b: "С такими союзниками – путь только в бездну!"

