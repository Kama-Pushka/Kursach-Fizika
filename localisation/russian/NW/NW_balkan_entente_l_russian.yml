 ###GUI###
 NW_level_of_trust_tt_0: "Уровень §Gдоверия§! между странами §ZБалканской Антанты§!"
 NW_level_of_trust_tt_1: "Текущий уровень: [?global.NW_level_of_trust_var|H0%%]\n\nЧем больше уровень §Gдоверия§! и §Yотношений§! между странами §ZБалканской Антанты§!, тем больше шанс, что страны станут исполнять взятые на себя §Yобязательства§!."
 