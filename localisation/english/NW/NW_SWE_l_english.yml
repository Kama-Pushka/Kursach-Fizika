 SWE_peoples_house: "Folkhemmet"
 SWE_peoples_house_desc: "The concept of the "People's Home" (Folkhemmet) was formulated by the leader of the Swedish Social Democrats, Per Albin Hansson. The essence of this metaphor is that the state should be organized like a good, close-knit family in which there are no privileged or underprivileged members, no favorites and no stepchildren, and where relationships are founded on equality, care, cooperation, and mutual aid. After becoming Prime Minister in 1932, Hansson began putting this idea into practice through a policy of "historic compromise" between labor and capital, the expansion of progressive taxation, efforts to combat unemployment, pension reforms, and family support—all of which helped transform the ideas of class struggle into a nationwide consensus."
