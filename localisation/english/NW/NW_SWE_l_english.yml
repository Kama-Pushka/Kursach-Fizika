 SWE_riksdag_category: "The Riksdag"
 SWE_riksdag_category_desc: "The traditions of popular assemblies and democracy are deeply rooted in Swedish society. Even the royal house never possessed absolute power in the country and had to reconcile with the will of the Riksdag.\n\nIn order to pass legislation, the government must command the support of a simple majority of MPs—meaning 116 out of 230 representatives must back the cabinet. This can be achieved not only through elections but also by negotiating with other parties to secure their temporary backing to pass a specific bill. But tread carefully: certain parties will radically oppose laws that conflict with their core ideology.\n\n\n\n\n\n§RCPWS§! Deputies: [?SWE_deputies_of_KPSH|0+]\n§OSocialist Party§! Deputies: [?SWE_deputies_of_socialistic_party|0+]\n§BSAP§! Deputies: [?SWE_deputies_of_SDRPSH|0+]\n§GAgrarian League§! Deputies: [?SWE_deputies_of_Farm_league|0+]\n§YPeople's Party§! Deputies: [?SWE_deputies_of_Peoples_party|0+]\n§LGeneral Electoral League§! Deputies: [?SWE_deputies_of_General_Electoral_League|0+]\n§8Nazi§! Deputies: [?SWE_deputies_of_nazi|0+]\n\n\n\nCurrent Government Support: [?SWE_summ_of_deputies|0+]"
