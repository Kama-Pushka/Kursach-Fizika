 ###############
 ### События ###
 ###############
 
 NW_SWE.1.t: "Choosing the Bill Option"
 NW_SWE.1.d: "Prior to the bill's introduction, the parliamentary Defense Commission investigated the future of the nation's defense, concluding that the annual defense budget should be set at 148 million kronor. The Social Democratic leadership, however, is proposing a scaled-back draft of only 130 million kronor.\n\nThe bill was preceded by internal debates within the Social Democratic Party. Per Edvin Sköld and Gustav Möller formed an internal faction that wanted to delay any decision on the defense budget until after the elections; in the event of a potential electoral defeat, they wished to leave this issue to the opposition. This was because several leading Social Democrats believed that the party could not actively campaign for increased defense spending. At the same time, there was a prevailing opinion that, regardless of party affiliation, no government could propose a reduced defense budget given the international situation. Therefore, a section of the Social Democratic Party believed it would be better if the decision were left to the bourgeois parties.\n\nPer Albin Hansson, however, argues that defense expenditures could skyrocket under a bourgeois government, whereas a Social Democratic government could exert a stabilizing, restraining influence on the defense budget."
 NW_SWE.1.a: "We will propose our own, scaled-back version of the bill."
 NW_SWE.1.b: "We agree to the option proposed by the Commission."

 NW_SWE.2.t: "Dissatisfaction with the Draft Law"
 NW_SWE.2.d: "The minority Social Democratic government under Per Albin Hansson has introduced its compromise defense bill to the Riksdag. The Social Democrats proposed a minor increase in military expenditures (to 130–148 million kronor), but the right-wing opposition deemed this amount insufficient, demanding large-scale rearmament and more stringent measures. The situation has been further exacerbated by disputes over funding: the left demands a progressive tax on the wealthy, while the right insists on equal contribution from all segments of the population. The opposition bourgeois parties have blocked the government's draft in parliament. In response, they have put forward their own counter-proposal, fully based on the findings of the Defense Commission."
 NW_SWE.2.a: "Very well, we will accept the Defense Commission's draft."
 NW_SWE.2.b: "We will offer to accept it, provided it is paired with a pension increase."
 NW_SWE.2.c: "Then it is better for us to resign."

 NW_SWE.3.t: "Rejection by the Bourgeois Majority"
 NW_SWE.3.d: "Hansson's government attempted a clever political maneuver: alongside the expansion of the military budget, they demanded the simultaneous passage of a bill to increase pensions. As expected, the right-wing opposition voted against the proposal. However, this move allowed the Social Democrats to score additional political points with the electorate during the ongoing debates, framing themselves as champions of the elderly standing against right-wing militarism."
 NW_SWE.3.a: "We must now resign to improve our political standing."
 NW_SWE.3.b: "We have done all we could."

 NW_SWE.4.t: "The Vacation Government"
 NW_SWE.4.desc: "Following the resignation of Prime Minister Per Albin Hansson, the King must choose a representative from one of the bourgeois parliamentary parties to form a new government. This administration is bound to be short-lived due to the upcoming parliamentary elections, leading some to already dub it the 'Vacation Government'."
 NW_SWE.4.a: "Let the conservative leader, Gösta Bagge, handle this."
 NW_SWE.4.b: "The Liberals, led by Felix Hamrin, should take charge."
 NW_SWE.4.c: ""
 NW_SWE.4.d: "The Agrarian leader, Axel Pehrsson-Bramstorp, can handle this."

 NW_SWE.5.t: "Results of the Commission's Trip"
 NW_SWE.5.d: "Our tank commission has visited various European countries, studying their armored forces and manufacturing facilities. They have also assessed the possibilities for armored vehicle production for our country and identified specific models. Now we must choose which of these nations to prioritize."
 NW_SWE.5.a: "We will choose Czechoslovak manufacturers."
 NW_SWE.5.b: "We will choose French manufacturers."
 NW_SWE.5.c: "We will choose German manufacturers."
 
 NW_SWE.1.t: "Elections to the Lower House of the Riksdag"
 NW_SWE.6.d: "Yesterday, general elections were held for the lower house of the nation's parliament. The vote counting, completed today, provided a definitive assessment of the current government's performance. The Prime Minister must now decide whether he and his ministers will remain in office or tender their resignation."
 NW_SWE.6.a: "Retain the current government."
 NW_SWE.6.b: "Tender our resignation."

 NW_SWE.7.t: "Forming a New Government"
 NW_SWE.7.desc: "The King must choose whom to invite to form a government as Prime Minister. The administration must command enough seats in parliament to operate effectively and pass legislation. Therefore, we should consider selecting the leader of the most popular party, or perhaps a less popular one capable of forming a coalition with other factions.\n\nTypically, the right-wing parties are prepared to unite into a single bourgeois coalition under one of their leaders. Meanwhile, the Social Democrats can look to the Agrarians or Liberals as allies, though they rarely consider the radical left as viable coalition partners."
 NW_SWE.7.a: "The Social Democrats should lead the cabinet."
 NW_SWE.7.b: "The Liberals should lead the cabinet."
 NW_SWE.7.c: "The Agrarians should lead the cabinet."
 NW_SWE.7.d: "The Conservatives should lead the cabinet."

 NW_SWE.9.t: "Per Albin Hansson Has Died"
 NW_SWE.9.desc.a: "Since this morning, Hansson had been complaining of pain in his left arm, which he could barely lift. Despite the pain, Hansson was in good spirits during dinner. After coffee, he played bridge with his guests. Hansson left the Operakällaren shortly after midnight and, as usual, boarded tram line 12 to travel to his townhouse in Ålsten. Upon stepping off the tram at the Ålstensgatan station, he collapsed to the ground from a heart attack. It is believed he died instantly. Witnesses called the police and an ambulance, but by the time they arrived at St. Göran Hospital, he was already dead. Hansson will be buried at the Norra begravningsplatsen in Stockholm."
 NW_SWE.9.desc.b: "$NW_SWE.9.desc.a$\n\nThe Social Democrats must urgently select a successor to replace Hansson as Prime Minister and, crucially, as party leader. The future direction of the nation's leftist movement depends on this choice."
 NW_SWE.9.a: "Party leader: Ernst Wigforss"
 NW_SWE.9.b: "Left-wing veteran: Gustav Möller"
 NW_SWE.9.c: "Young compromise candidate: Tage Erlander"
 NW_SWE.9.d: "The architect of the People's Home died as a common man."

 NW_SWE.10.t: "The Conservatives Change Their Name"
 NW_SWE.10.d: "Established in 1904, the 'General Electoral League' was originally conceived by conservatives not as a traditional political party—as party structures were viewed with prejudice at the time—but rather as a loose, decentralized coalition and coordinating body for fundraising and campaigning.\n\nBy now, Swedish politics has completely transformed: the Social Democrats have constructed a powerful and disciplined party machine. The conservatives need to establish a rigid nationwide structure with formal party membership, a unified platform, and centralized leadership under their head, Gösta Bagge.\n\nFurthermore, until the mid-1930s, Swedish conservatives in parliament were split into two independent groups based on the chamber. In 1935, these factions finally overcame their internal differences and merged into a single parliamentary body—the 'National Party of the Right.' The name of the nationwide organization needed to reflect this long-awaited countrywide unity.\n\nAdditionally, the historic name 'General Electoral League' has become outdated and resonates little with the average voter. Incorporating the word 'Right' into the title will make the party's ideology clear and unmistakable."
 NW_SWE.10.a: "A timely decision."

 NW_SWE.11.t: "Gösta Bagge Steps Down as Conservative Leader"
 NW_SWE.11.d: "Gösta Bagge has resigned as leader of the Right Party. The primary catalyst for his departure was the outcome of the recent parliamentary elections. Under Bagge's leadership, the conservatives lost a significant number of seats, marking one of the worst performances in their history. Party members began demanding a leadership overhaul. Initially, the party elite and Gösta Bagge himself viewed Martin Skoglund—an influential politician from Östergötland—as the ideal successor. However, Skoglund categorically refused to assume leadership and take responsibility for a party in crisis. Following Skoglund's refusal, the leadership swiftly consolidated around Fritiof Domö. He represents the moderate, agrarian-landowning wing of the party. Today, at the party conference, Domö's candidacy was officially approved without any open opposition or rift."
 NW_SWE.11.a: "The end of the professor's career."

 NW_SWE.12.t: "Gustaf Andersson Resigns as Liberal Leader"
 NW_SWE.12.d: "Gustaf Andersson has stepped down as head of the People's Party. This is widely seen as a calculated move by the party elite, who recognize the need for rejuvenation. The left wing of the Social Democrats has introduced a radical platform for the country's development, involving heavy state intervention in the economy and elements of socialization. Gustaf Andersson, being a pragmatic, old-school politician, lacks the theoretical weight required for an ideological duel. The party needs a leader capable of debating on equal terms with the Social Democrats' economic theorist, Ernst Wigforss. Andersson was offered the prestigious and quiet post of Governor of his home province, Dalarna (Kopparberg), allowing for a smooth transition of power free of public scandal. Replacing him is the rising star of the Liberals—Bertil Ohlin, an economist, co-founder of the Stockholm School of Economics, and a student of John Maynard Keynes. In 1934, Ohlin was appointed chairman of the People's Party's newly created Youth League, a position he held until 1939. Since 1937, he has increasingly focused on his political role and is now ready to take the reins of the entire party."
 NW_SWE.12.a: "With such forces, the Liberals can reach new heights."
 
 NW_SWE.15.t: "The Right Criticizes the Bill"
 NW_SWE.15.d: "The main bourgeois parties have united in their criticism of the bill currently under consideration in the Riksdag. The right-wing leaders have already refused to accept it, while the Liberals seem to be in a state of limbo. Ultimately, we will most likely have to pass the bill without their support."
 NW_SWE.15.a: "This was to be expected."

 NW_SWE.16.t: "The Left Criticizes the Government"
 NW_SWE.16.d: "All the left-wing parties in the Riksdag have come out against the bill currently under debate. They argue that the laws pushed by our government strike at ordinary Swedes, and claim that our own parties are merely puppets of big capital, designed to serve the very interests this new law aims to aid."
 NW_SWE.16.a: "This is cheap populism."

 NW_SWE.17.t: "The Leader's Day"
 NW_SWE.17.d: "Today, Sven Olov Lindholm, leader of the National Socialist Workers' Party, organized a large-scale event dubbed 'The Leader's Day' (Ledarens dag), which effectively serves as his party's national congress. The main venue for the convention is the 'Auditorium' hall in Stockholm, located in the Norra Bantorget district. This prestigious public venue was specifically rented by the party to draw maximum attention from the city's residents. The central event of the daytime program was a keynote lecture delivered by Lindholm himself. In his speech, he proclaimed a 'New Course,' emphasizing that the movement is moving away from blindly copying German Hitlerism and steering toward a 'purely Swedish national socialism.' A column of Swedish Nazis ('Lindholmers'), bearing lit torches, set off from Östermalmstorg and marched through the central streets of Stockholm toward the convention hall.\n\nThe next part of the congress featured a theatrical display of stormtroopers changing outfits and altering party regalia right before the eyes of the attendees and the invited press. Party functionaries and stormtroopers from the youth wing (Nordisk Ungdom) were ordered on the spot to discard their brown shirts. They were replaced by new blue shirts, intentionally designed to evoke the colors of the Swedish flag. Swastikas were stripped from the walls and banners. In their place, party members affixed emblems featuring the Vasa sheaf (Vase kärven). Lindholm personally demonstrated the new badges and flags to the press, attempting to prove the 'indigenous Swedish origin' of his symbols. Eyewitnesses reported that the ban on the Roman salute was strictly enforced at the convention. Instead, a new internal greeting was introduced, marketed as 'Old Norse.'\n\nFurthermore, Lindholm announced a change to the party's name—it will henceforth be known as the 'Swedish Socialist Gathering' (Svensk Socialistisk Samling). In this manner, Lindholm continues to play into left-wing sentiments in the spirit of his 'more leftist Nazism'—akin to the ideas of the German Strasser brothers, who were purged by Hitler in Germany."
 NW_SWE.17.a: "Will this help him?"

 NW_SWE.18.t: "Furugård Dissolves His Party"
 NW_SWE.18.d: "The Swedish National Socialist Party was formed on October 1, 1930, as a merger of a large number of previously existing, scattered minor fascist and Nazi movements in Sweden into a single federation, but this unity did not last long. Its leader was Birger Furugård, whose official title within the party was 'Riksledare.' The party also included the youth organization 'Vikingarna' and the women's group 'Kristina Gyllenstierna.' At the peak of its strength in 1933, the party boasted 10,000 members. Sven Olov Lindholm was the second-in-command and served as the editor of the magazine 'Vår Kamp.'\n\nIn 1933, a major rift tore the party apart. The friction between Furugård and Lindholm had been smoldering since 1932, stemming from a dispute between Lindholm (who held somewhat more left-wing views) and the Gothenburg branch of the party (which was controlled by more conservative elements). Furugård remained close to the Gothenburg branch and became somewhat financially dependent on it. On January 13, 1933, Furugård expelled Lindholm and his adherents from the party following a chaotic session of the Grand Council. In response, Lindholm founded his own party, the National Socialist Workers' Party, on January 14, 1933. Moreover, Lindholm dispatched a declaration to party branches accusing Furugård of corruption. The leader of the stormtroopers, Hedengren, sided with Lindholm, and many young party members soon followed suit.\n\nFollowing the split, both parties competed fiercely for backing and recognition from both the Swedish electorate and their German counterparts. Ultimately, Lindholm's movement solidified its position as the preeminent National Socialist movement in Sweden. The recent elections fully vindicated this—Furugård's party garnered barely more votes than its actual current membership, with only 3,025 people nationwide casting a ballot for it.\n\nToday, utterly defeated and demoralized, Furugård has conceded, announcing the dissolution of his party and urging his followers to unite behind Lindholm."
 NW_SWE.18.a: "An inglorious end."

 NW_SWE.19.t: "Merger of the Right-Wing Youth Forces"
 NW_SWE.19.d: "The National Youth League of Sweden (Sveriges Nationella Ungdomsförbund) was a political organization founded in 1915 as the youth wing of the conservative Right Party. Throughout the 1920s and early 1930s, the organization progressively drifted toward more radical right-wing positions, advocating for corporatism and a pro-German foreign policy. Ideological rifts led to an official break with the Right Party in 1934, transforming the league into an independent political movement centered on a nationalist platform. In 1935, the organization changed its name to the National League of Sweden (Sveriges Nationella Förbund) and contested the 1936 parliamentary elections, but failed to secure broad voter support, remaining a minor right-wing party.\n\nAnother significant right-wing organization, the 'National League New Sweden' (Nationella Förbundet Nya Sverige), was established on October 28, 1930, by public figure Per Engdahl after his departure from the Swedish Fascist Struggle Organization. Based predominantly in Malmö, the movement forged its own ideological doctrine—'New Swedishness' (Nysvenskhet)—which fused radical Swedish nationalism, anti-Marxism, staunch anti-communism, and a concept of corporatism modeled after the Italian political structure. The organization deliberately distanced itself from mirroring German Nazism and functioned more as an elite political club, refraining from entering parliamentary elections. The primary vehicle for disseminating its ideas and consolidating its base was its own periodical, 'Vägen Framåt' (The Way Forward), which began regular publication in 1932.\n\nToday, their official merger took place. The catalyst for unification was the National League of Sweden's dismal showing in the recent elections, coupled with the fact that Engdahl's movement was failing to gain mass traction. Both groups realized that remaining separate meant certain isolation. As a result of the merger, the National League of Sweden officially adopted Engdahl's concept of 'New Swedishness.' At the post-merger party conference, a new platform was ratified, proclaiming the party a 'corporative, New Swedish, radical, national, and socialist' organization. The conservative Elmo Lindholm remained the leader of the unified body, but Per Engdahl secured a seat on the executive committee and the vital post of vice-chairman. In this way, they hope to marry the mass appeal and popularity of one movement with the intellectual substance of the other."
 NW_SWE.19.a: "Let us see where this leads."
 
 NW_SWE.20.t: "The Expulsion of Kilbom from Kilbom's Own Party"
 NW_SWE.20.d: "In October 1929, a severe rift tore through the Communist Party of Sweden. The party's founders and primary leaders, led by Karl Kilbom and Nils Flyg, openly opposed the Comintern's directives regarding the shift to 'class against class' tactics and the denunciation of Social Democrats as 'social-fascists.'\n\nAs a result of the split, the entire Communist parliamentary group, the party's official newspaper 'Folkets Dagblad Politiken,' and the majority of its most radical members sided with the Kilbom-Flyg faction. Until 1934, the breakaway group operated under the exact same name as the old party—the Communist Party. To differentiate between the two, this faction became widely known as the 'Kilbommare' (Kilbomites), while those who remained loyal to the old party were dubbed the 'Sillenare' (Sillenites, named after their leader Hugo Sillén).\n\nIn 1934, they were joined by a breakaway Social Democratic faction from Gothenburg led by Albin Ström, after which the unified party officially rebranded itself as the Socialist Party, even outstripping the pro-Soviet wing in public support. The party's political platform leaned heavily on anti-Stalinism and an independent path toward socialism.\n\nToday, however, another rift has struck the party: General Secretary Nils Flyg, unable to withstand the competition from other working-class figures—primarily Karl Kilbom—has officially expelled Kilbom from the party, branding him a 'renegade who capitulated to bourgeois social democracy.' It is well known that Flyg had already removed Kilbom from his post as editor-in-chief of the party newspaper six months prior.\n\nIn protest of this expulsion, other prominent party representatives, including Evald Höglund and Ture Nerman, have resigned from the Socialist Party. They were demonstratively followed by thousands of class-conscious workers and entire regional party chapters, particularly in Stockholm."
 NW_SWE.20.a: "A tragic end."

 NW_SWE.21.t: "Karl Kilbom Returns to the Social Democrats"
 NW_SWE.21.d: "The expelled leaders of the Socialist Party chose not to found a new political movement. Today, Karl Kilbom officially submitted his application and rejoined the Social Democratic Party of Sweden—the very party he had left back in 1917 to co-found the Communist Party."
 NW_SWE.21.a: "A welcome reinforcement for the Social Democrats."

 NW_SWE.22.t: "The Appeal of the Swedish Socialist Party"
 NW_SWE.22.d: "In 1929, a major schism divided the Communist Party of Sweden between those who favored blindly following Moscow's directives and those who opposed it. At the time, the Swedish communists split into two separate parties bearing identical names, with the anti-Moscow faction initially holding an electoral advantage. However, by now, internal conflicts have caused their movement—which eventually rebranded as the Socialist Party—to hemorrhage supporters. The situation has grown so critical that its leader, the staunch anti-Stalinist Nils Flyg, has approached us with a plea for financial backing in exchange for a willingness to lobby for our interests within the Swedish parliament."
 NW_SWE.22.a: "We will assist them, as absurd as it sounds."
 NW_SWE.22.b: "We have no intention of supporting communists."

 NW_SWE.23.t: "The Schism within the Socialist Party"
 NW_SWE.23.d: "Recent changes in the Socialist Party's rhetoric point to deep-seated internal contradictions. Nils Flyg has taken his anti-Moscow critique so far that he has begun calling for an official ban on the pro-Comintern Communist Party of Sweden. Rumors also circulate that he has recently begun receiving funding from Germany—a desperate step forced upon him by a catastrophic drop in party membership and popularity.\n\nAgainst this backdrop, a Gothenburg-based faction led by Albin Ström has broken away from the party. Today, Ström convened a party conference in the city, where he announced the formation of the new 'Left Socialist Party.' He was joined by his predominantly local supporters, along with their weekly newspaper, 'Arbetarposten.'"
 NW_SWE.23.a: "It seems the German funding did little to save Flyg."

 NW_SWE.24.t: "The Death of Nils Flyg"
 NW_SWE.24.d.a: "Today, news broke of the passing of Nils Flyg, the founder and leader of the Socialist Party. He died from a cardiac blood clot. His cardiovascular issues had persisted since 1941, and subsequent medical treatments ultimately proved unsuccessful."
 NW_SWE.24.d.b: "$NW_SWE.24.d.a$\n\nThe party will now be led by Albin Ström, the head of the Gothenburg branch. Unlike Flyg and his inner circle—who in recent years sought backing abroad from nations in open conflict with the USSR—Ström is far less dogmatic regarding Moscow and advocates for the genuine realization of an independent socialism in Sweden."
 NW_SWE.24.d.c: "$NW_SWE.24.d.a$\n\nThe party will now be led by Agaton Blom, Flyg's closest associate who originally migrated with him from the Communist Party of Sweden, but who has also adopted pro-Nazi positions. Confirming this trajectory at an emergency party congress, Blom announced that the party is changing its name—it will henceforth be known as the Swedish Socialist Coalition."
 NW_SWE.24.a: "With Flyg gone, the party itself is likely near its end."
 
 NW_SWE.25.t: "Criticism of Defense Readiness"
 NW_SWE.25.d: "Against the backdrop of rising international tensions and external threats to our nation, the right-wing parties have intensified their criticism of previous administrations, and specifically the Social Democrats. They point out that it was the left who loudest championed the country's disarmament and maintained pacifist sentiments so stubbornly and for so long. The opposition argues that the nation crossed a dangerous line in this pursuit, lagging too far behind in establishing a modern defense industry—which, as recent news demonstrates, is becoming the pivotal factor in a country's ability to protect itself."
 NW_SWE.25.a: "They have a point."

 NW_SWE.26.t: "Finland in Jeopardy"
 NW_SWE.26.d: "Finland has come under attack from the Soviet Union. For over 600 years, this land was a part of our state, and when it finally secured its independence following the collapse of the Russian monarchy, we actively aided them in doing so. Furthermore, deep-seated fears of communism and the Russian threat continue to permeate our society. All of this has fostered a broad public consensus in favor of Swedish intervention in the Soviet-Finnish War. At a citizens' rally in Uppsala, representatives from all political parties—save for the Communists—united to voice support for a Swedish intervention. The majority of the high-ranking officer corps also advocates for direct military assistance, arguing that it is far better to defend against potential further Soviet expansion on Finnish soil than on our own. Many fear that Sweden itself could be Moscow's next target."
 NW_SWE.26.a: "We will not entangle ourselves in the Soviet-Finnish War."
 NW_SWE.26.b: "We will stand with our Finnish brothers."

 NW_SWE.27.t: "Demands for a National Government"
 NW_SWE.27.d: "The refusal of the government, and the Prime Minister personally, to aid Finland in the war has sparked widespread public outrage among various civic organizations. Right-wing forces have begun consolidating their ranks to force a firm and decisive reaction from the cabinet. Today, this discontent spilled over into the halls of parliament during a heated debate. A faction of MPs is now preparing to table a motion of no confidence against the government, hoping to force its resignation and replace it with a more interventionist administration."
 NW_SWE.27.a: "We command enough strength to survive this vote."

 NW_SWE.28.t: "No-Confidence Motion Passed"
 NW_SWE.28.d: "As predicted by many analysts, the Riksdag vote on the motion of no confidence brought together an incredibly diverse array of political factions. All conservative and far-right MPs were joined by nearly half of the Social Democratic representatives and the Socialist faction, all of whom broke ranks to adopt an interventionist stance. As a result, the motion of no confidence has passed, meaning the current government will be forced to resign in short order."
 NW_SWE.28.a: "These madmen are dragging us into a war!"

 NW_SWE.29.t: "The Government Holds"
 NW_SWE.29.d: "During the Riksdag vote on the motion of no confidence against the current cabinet, representatives from vastly different political factions joined forces. All conservative and far-right MPs, alongside nearly half of the Social Democratic representatives and the Socialist faction, broke ranks to adopt an interventionist stance. However, even this unprecedented consolidation fell just short of the required majority to pass the motion and bring down the government."
 NW_SWE.29.a: "The Prime Minister prevailed, but we cannot ignore their voices."

 NW_SWE.30.t: "The King Chooses a National Coalition Leader"
 NW_SWE.30.d: "With the previous cabinet forced to tender its resignation, the King must now select a new Prime Minister. In the face of the current international emergency, this decision could prove decisive for the nation's independence. Two primary candidates are under consideration for the office."
 NW_SWE.30.a: "The Social Democrat Torsten Nothin is the ideal candidate."
 NW_SWE.30.b: "The non-partisan diplomat Christian Günther is the ideal candidate."
 
 NW_SWE.31.t: "Election Campaigning"
 NW_SWE.31.desc: "The elections are approaching, and each party is beginning to launch its electoral campaign. We must decide which campaigning strategy our party will pursue in this election."
 NW_SWE.31.a: "We will campaign on our plans to build the People's Home."
 NW_SWE.31.b: "We will highlight our economic policy, which helped overcome the Great Depression."
 NW_SWE.31.c: "We will focus on the left's suspected plans to socialize businesses."
 NW_SWE.31.d: "We will emphasize the need to protect our national identity."
 NW_SWE.31.e: "We will emphasize the necessity of ensuring our nation's safety and defense."
 NW_SWE.31.f: "We will focus on the threat of a dictatorship being established in the country."
 NW_SWE.31.g: "We will place our emphasis on the church and the Christian faith."

 NW_SWE.32.t: "The Beginning of Arduous Negotiations"
 NW_SWE.32.d: "During the first half of the 1930s, Sweden was shaken by waves of strikes that paralyzed ports and factories. In 1934, the government appointed a special 'Labor Peace Commission' (Mammututredningen), which delivered its report in 1935. Active debates began in the Riksdag regarding laws that would legally ban strikes in pivotal sectors of the economy and restrict trade union rights, while also threatening to impose numerous rigid regulations on private businesses.\n\nThis turn of events satisfied no one. The trade unions were terrified of losing their right to strike and their autonomy. Employers, meanwhile, fiercely opposed state intervention in their enterprises and labor conditions dictated from above. Both groups agreed to engage in compromise negotiations with each other, strictly excluding direct government interference.\n\nThe initial meeting of the delegations took place this week. The parties immediately agreed to bypass discussions on specific wages—which would have driven the talks into a stalemate—and focus instead on the general rules of the game: conflict resolution mechanisms. A joint working group was established, named the Labor Market Committee (Arbetsmarknadskommittén). The unions are represented by August Lindberg, chairman of the Swedish Trade Union Confederation (LO), while Gustav Söderlund, head of the Swedish Employers' Confederation (SAF), sat down at the negotiating table on behalf of the employers.\n\nThey realized that a breakthrough would be impossible in Stockholm, under the watchful eyes of journalists and the radical wings of their own organizations. Their work required a secluded venue. The Committee selected the reputable Grand Hôtel in Saltsjöbaden for their meetings. It is anticipated that the negotiation process will be lengthy."
 NW_SWE.32.a: "We will await the outcome of the negotiations."

 NW_SWE.33.t: "The Saltsjöbaden Agreement"
 NW_SWE.33.d: "For over two years, negotiations between representatives of labor and employers have been underway at a luxury hotel in the resort town of Saltsjöbaden. The talks have been conducted in a markedly respectful, pragmatic, and even gentlemanly manner, giving rise to the term 'The Spirit of Saltsjöbaden.' The consultations followed a strict schedule: demanding, exhausting discussions on specific clauses during the day, followed by delegates dining and drinking coffee together in the evening. This helped break the ice of long-standing class hostility and allowed them to view each other as equal partners.\n\nThe negotiations nearly broke down several times over two fundamental issues. The first was the so-called 'Paragraph 32,' which addresses the right to terminate employment. The employers of the SAF stood firm on their historic right to solely hire, fire, and distribute work. The unions demanded protection against arbitrary dismissals. Ultimately, the LO agreed to recognize management's right to direct production, but in return, the SAF pledged to strictly regulate dismissal procedures, introducing mandatory advance notice and justification of causes.\n\nThe second issue concerned strike restrictions and the protection of third parties. Employers demanded a total ban on strikes that harm the public interest (such as in healthcare, firefighting, or transport). The unions viewed this as an assault on their primary weapon. The parties agreed to establish a joint body that, in the event of a threat to public interests, would act as an arbitrator, blocking radical actions from both workers (strikes) and employers (lockouts)."
 NW_SWE.33.a: "What was the final decision?"

 NW_SWE.34.t: "Discontent on the Left Wing"
 NW_SWE.34.d: "The signing of the Saltsjöbaden Agreement has triggered a wave of harsh criticism from the radical wing of the Swedish labor movement. For left-wing socialists, communists, and syndicalists, the document looks less like a triumph and more like a capitulation to the bourgeoisie and a voluntary abandonment of the class struggle. The primary critics emerged from two forces: the syndicalist union SAC (Central Organisation of the Workers of Sweden) and the left-wing faction within the LO (Swedish Trade Union Confederation) itself.\n\nThe greatest outrage was sparked by the LO leadership's official recognition of the notorious 'Paragraph 32' of the Employers' Confederation (SAF) statute. This clause enshrined the employer's absolute right to solely manage production, allocate work, and hire or fire personnel. The left argues that workers should instead fight for workers' control in factories and industrial democracy.\n\nFurthermore, the Saltsjöbaden Agreement introduces a complex, multi-tiered system of mandatory negotiations and arbitration before workers possess the legal right to halt work. Economic sanctions against third parties and strikes in 'essential' sectors are strictly prohibited. For anarcho-syndicalists, a direct strike at the workplace without top-down sanction was their primary leverage and an expression of working-class solidarity. The new treaty effectively outlaws unapproved wildcat strikes.\n\nThe left wing also points out that Saltsjöbaden has locked in a rigid centralization of authority within the trade unions. All power was transferred from local factory committees to the supreme LO council in Stockholm. This consolidation was necessary for the LO leadership to push through the agreement, as several local chapters had flatly refused to sign it."
 NW_SWE.34.a: "Perhaps things are not as bright as they seem."

 NW_SWE.35.t: "Conflict Between the Unions"
 NW_SWE.35.d: "Recently, reformist trade unions (those affiliated with the LO—the Swedish Trade Union Confederation) have increasingly sought to conclude agreements stipulating that employing companies must exclusively hire workers affiliated with the reformist union. Employees choosing alternative union organizations face dismissal. A formal complaint regarding this practice has been submitted to the Labour Court in Stockholm, which resolves labor disputes. While this may appear to be a clear violation of Swedish association laws, we must decide whether to support the reformist unions or uphold the right of workers and employers to freely enter into agreements without interference from union leadership."
 NW_SWE.35.a: "We will maintain our independence and impartiality in this matter."
 NW_SWE.35.b: "We will support the unions, even if it potentially interprets the law incorrectly."

 NW_SWE.36.t: "Core Principles of the Agreement"
 NW_SWE.36.d: "Ultimately, after two and a half years of grueling legal and diplomatic work, the text of the agreement was officially ratified and signed in Saltsjöbaden today. The document comprises five main chapters detailing:\n\n1. The operational procedures of the permanent Labor Market Committee.\n\n2. The negotiation process required before any labor disputes can be declared.\n\n3. Rules regarding dismissals and personnel downsizing.\n\n4. A ban on economic sanctions against third parties not involved in a conflict.\n\n5. The protection of essential public functions (utilities, public health)."
 NW_SWE.36.a: "Raise your glasses!"
 
 NW_SWE.37.t: "The Swedish Line"
 NW_SWE.37.d: "Today in Stockholm, a pamphlet titled 'The Swedish Line' (Den svenska linjen) was published. Its authors are Per G. Andreen, Arvid Fredborg, Thorgny T.son Höjer, T. Åke Leissner, Per Gunnar Nordin, and Gunnar Unger. All the authors belong to youth political organizations, and several were members of the right-wing nationalist National League of Sweden. The primary motif of the pamphlet is a call for the youth to join right-wing parties and cast their votes for them in the upcoming elections.\n\nAs such, it marks a pivotal turning point in the worldview of young Swedish conservatives, who had previously flirted with right-wing radicalism in circles like 'Svensk Ungdom.' Faced with an external threat, they have now discarded their anti-parliamentary sentiments. In the pamphlet, the authors oppose those who wish to align with either the German or Soviet Russian lines, advocating instead for a distinct Swedish line—hence the pamphlet's title. The authors take turns explaining their reasons for distancing themselves from the two great powers before outlining what a separate Swedish line would entail.\n\nThe text contains sharp criticism of Swedish disarmament, which resulted from the Defense Act of 1925. The critique of Prime Minister Per Albin Hansson is severe: 'The Prime Minister, on the other hand, felt entitled to state that he, for his part, does not regret his participation in 1925. On this occasion, as well as on his words in the autumn of 1939, \"our readiness is good,\" posterity will deliver its verdict.'"
 NW_SWE.37.a: "This is a solid foundation."

 NW_SWE.38.t: "External Matters"
 NW_SWE.38.d: "The main foreign policy thesis of the document is that a free Nordic region is Sweden's paramount objective ('The Baltic Sea and the Nordic region are Sweden's living space'). Particular emphasis is placed on demanding an end to the German occupation of Norway ('The liberation of Norway and its political and military restoration is a matter of life and death for us'), as well as resisting Soviet pressure on Finland ('After our own freedom, the freedom of Finland is our primary foreign policy goal').\n\nThis stance against Nazi and Communist aggression is also reflected in domestic policy demands for measures against Swedish adherents of these ideologies: 'Even considering potential foreign policy complications, the demand for the dissolution of the Communist Party cannot be avoided. It is equally necessary to take action against Swedish National Socialists.' In the latter case, however, a warning was issued against 'painting everyone to the right of the right with the same brush.'\n\nThe pamphlet says little about the consequences of the war outside the Nordic countries. The authors regretted the situation and stressed that Sweden traditionally maintained good relations with both Germany and Great Britain: 'Economically and politically, it is of the utmost importance for our people that the good relations that have existed between us and England for centuries are preserved.'"
 NW_SWE.38.a: "This is rational."

 NW_SWE.39.t: "Internal Matters"
 NW_SWE.39.d: "Following the section on foreign policy, the document addresses defense, demographics, the economy, and social aspects, viewed through the lens of the current global situation. The chapter dedicated to the so-called population problem also presents reflections on racial hygiene and antisemitic tendencies:\n\n'Closely linked to the demographic question are the issues of racial hygiene and immigration. In our view, there is no reason to deny the necessity of a sensible racial policy because of discouraging examples abroad. For instance, it is vital for us to address the problem of reproduction among inferior elements, which is particularly noticeable in our psychiatric hospitals and asylums. Furthermore, the vast majority of young Swedes—and we are no exception—consider the homogeneous composition of our population to be an inherent value. Attempts at the mass employment of Jewish refugees as specialists in our country have caused great irritation and may also create conflicts in the future. The immigration problem depends entirely on the demographic question. For us, it is important to ensure that there is no need for immigration.'\n\nFinally, the responsibility of the youth was emphasized, including a demand to lower the voting age to 21 and a call for everyone to participate in the 1940 elections to the second chamber of parliament ('In the autumn elections, those who have the right to vote cannot stay at home'). The importance of high voter turnout was highlighted as a symbolic value of Swedish democracy and freedom:\n\n'If voter turnout drops sharply, it will, on one hand, strengthen anti-state groups and, on the other, significantly weaken Sweden's foreign policy position. Foreign powers will then be able to claim that the Swedish government represents only a minority of the Swedish people, and that this people is actually indifferent to its fate.'"
 NW_SWE.39.a: "A patriotic stance."

 NW_SWE.40.t: "Reception of the Pamphlet"
 NW_SWE.40.d: "It was explicitly emphasized that Swedish freedom and popular representation are ancient historical traditions rooted in the Middle Ages, rather than a mere 'liberal invention.' They called for the defense of the Swedish way of life. The manifesto proclaimed allegiance to Christian morality and the principle of the rule of law (lagbunden frihet—'lawful freedom').\n\nThe pamphlet was warmly received by both the conservative and liberal press. The liberal newspaper Dagens Nyheter described it as being driven by 'a sincere love for the motherland and a burning desire to contribute to a better and, above all, a stronger Sweden.' Another liberal paper, Upsala Nya Tidning, welcomed the fact that the pamphlet places the Swedish heritage above all else.\n\nThe authors of the manifesto also plan to begin publishing a permanent print organ for their movement, which will be named after the pamphlet."
 NW_SWE.40.a: "The young conservatives have returned to the fold."

 NW_SWE.41.t: "An Appeal to Reason"
 NW_SWE.41.d: "Today in Stockholm, the presentation of the book 'An Appeal to the Citizens' (Appell till medborgarna) by industrialist Axel Wenner-Gren took place. Wenner-Gren timed the release of the book to coincide with his large-scale public campaign. Ahead of the publication, in the first half of November, he actively delivered speeches promoting his ideas on 'Nordic cooperation.' The book was printed by the Bonniers publishing house and instantly caught the attention of the press due to the author's status.\n\nIt functions as a socio-political manifesto. In it, the founder of Electrolux and one of the wealthiest men on the planet shares his views on overcoming the global crisis, the threat of a new war, and the future of capitalism. Wenner-Gren writes that science and new technologies are capable of completely eradicating poverty and creating material abundance for all of humanity. He criticizes both radical socialism and wild capitalism, calling instead for cooperation between workers and industrialists for the common good. One of the main goals of the manifesto was to unite the Nordic countries (Sweden, Denmark, Norway, Finland, and Iceland) to maintain neutrality amidst rising aggression in Europe. The book is written in a humanistic style and condemns totalitarianism, urging world leaders to sit down at the negotiating table.\n\nFor many Swedes, the book came as a surprise: a tough, pragmatic, and incredibly successful capitalist suddenly acting as a humanist and peacemaker. Wenner-Gren also promises to release an English translation of the book in the near future for English-speaking readers."
 NW_SWE.41.a: "And who exactly is he?"
 
 NW_SWE.42.t: "Axel Wenner-Gren"
 NW_SWE.42.d: "Axel Wenner-Gren is one of the wealthiest, most influential, and well-known industrial magnates in the world. Born to a Swedish farmer and merchant, he received a commercial education in Germany and, thanks to his phenomenal talent as a salesman, built a global business empire. His crowning achievement was the creation and aggressive international expansion of the Electrolux corporation, which revolutionized domestic life by making absorption refrigerators and mass-market vacuum cleaners standard household items across the globe.\n\nBy the late 1930s, Wenner-Gren had stepped back from the operational management of his company and acquired a major stake in the arms giant Bofors. By 1937, he is the largest private landowner in Sweden, owner of the luxury mega-yacht Southern Cross, and a prominent philanthropist who has donated millions of kronor to establish the Stockholm-based Wenner-Gren Institute. This has secured him high prestige and direct access to the highest political circles in Europe and the United States, which he actively attempts to leverage to prevent the impending world war. For instance, it is known that last year he was received by American President Franklin Delano Roosevelt.\n\nCurrently, however, he has turned his attention to backing various politicians at home in Sweden, predominantly of a right-wing and far-right orientation. He finances the old conservative newspaper Nya Dagligt Allehanda. Furthermore, he funds the youth magazine 'Svensk Ungdom,' which serves as the organ of the organization of the same name and which, through its editor Gunnar Unger, disseminates propaganda against parliamentary democracy and champions 'national-radicalism'."
 NW_SWE.42.a: "Let us hope this does not take too tight a grip on people's minds."

 NW_SWE.43.t: "Proposal for the Joint Remilitarization of the Åland Islands"
 NW_SWE.43.d: "The Swedish government has approached us with a proposal to conclude a new agreement regarding the status of the Åland Islands. Under this agreement, Sweden commits to jointly defending the Ålands with us against foreign invasion. While their demilitarized status will be lifted, constructing defensive fortifications on them will remain prohibited."
 NW_SWE.43.a: "This is an excellent opportunity to compel Sweden to defend us."
 NW_SWE.43.b: "This will only provoke Moscow."

 NW_SWE.44.t: "Finland Rejects the Proposal"
 NW_SWE.44.d: "The Finnish government has rejected our proposed plan for the joint remilitarization of the Åland Islands. They justified this decision by their reluctance to abandon the convention established by the League of Nations, as well as the threat of provocations from the Soviet Union."
 NW_SWE.44.a: "This is unfortunate."

 NW_SWE.45.t: "Sweden Proposes Collective Defense"
 NW_SWE.45.d: "The Swedish government is proposing to establish a collective defense framework for the Nordic nations. They suggest creating our own alliance of northern states. This move is intended to safeguard each member country by forcing potential aggressors to realize they would have to face a united coalition. At the moment, they are seeking our specific stance on this proposal; once they gather the positions of the other Nordic countries, they will make their final decision."
 NW_SWE.45.a: "We agree."
 NW_SWE.45.b: "We will maintain our neutrality."
 
 NW_SWE.46.t: "Negotiation Results"
 NW_SWE.46.desc.a: "Our diplomats have held talks with their counterparts from the other Nordic nations to ascertain their stance on our proposed initiative."
 NW_SWE.46.desc.den.a: "Denmark has agreed to join the potential alliance."
 NW_SWE.46.desc.den.d: "Denmark has refused to join the potential alliance."
 NW_SWE.46.desc.nor.a: "Norway has agreed to join the potential alliance."
 NW_SWE.46.desc.nor.d: "Norway has refused to join the potential alliance."
 NW_SWE.46.desc.fin.a: "Finland has agreed to join the potential alliance."
 NW_SWE.46.desc.fin.d: "Finland has refused to join the potential alliance."
 NW_SWE.46.a: "Form the alliance."
 NW_SWE.46.b: "Shelve these plans."
