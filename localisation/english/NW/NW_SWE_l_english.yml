 SWE_expected_election_results_category_desc: "Elections to the Riksdag are conducted under a proportional representation system, utilizing party-list voting in multi-member constituencies. Since this creates the technical challenge of converting popular vote percentages into actual parliamentary seats, the D'Hondt method is applied. When distributing seats with this mechanism, party representation remains roughly proportional to the votes cast; however, the mathematical rounding inherent to the method favors larger parties.\n\n\n\n\n\n§RCPWS§! Popularity: [?SWE_popularity_of_KPSH|0+%%]\n§OSocialist Party§! Popularity: [?SWE_popularity_of_socialistic_party|0+%%]\n§BSAP§! Popularity: [?SWE_popularity_of_SDRPSH|0+%%]\n§GAgrarian League§! Popularity: [?SWE_popularity_of_Farm_league|0+%%]\n§YPeople's Party§! Popularity: [?SWE_popularity_of_Peoples_party|0+%%]\n§LGeneral Electoral League§! Popularity: [?SWE_popularity_of_General_Electoral_League|0+%%]\n§8Nazi§! Popularity: [?SWE_popularity_of_nazi|0+%%]"

