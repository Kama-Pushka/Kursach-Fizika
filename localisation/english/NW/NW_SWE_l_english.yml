 NW_SWE.46.combination.8: "$NW_SWE.46.desc.a$\n\n$NW_SWE.46.desc.den.a$\n\n$NW_SWE.46.desc.nor.d$\n\n$NW_SWE.46.desc.fin.d$"

 NW_SWE.47.t: "Nordic Unity"
 NW_SWE.47.d: "The Swedish government proposes that all member states of the Nordic Defense Union unite into a single federation of states, thereby fulfilling the long-standing Pan-Scandinavian ideal."
 NW_SWE.47.a: "We agree."
 NW_SWE.47.b: "We object."

 NW_SWE.48.t: "The Federation Project Fails"
 NW_SWE.48.d: "At the moment, the governments of Denmark and Norway are not prepared to move forward with merging our nations into a single Federation. However, it is possible that this project can be realized in the future."
 NW_SWE.48.a: "Let us hope so."

 NW_SWE.49.t: "Expansion of the Nordic Defense Union"
 NW_SWE.49.d: "The Swedish government is currently considering the possibility of expanding the Nordic Defense Union to include the Baltic states. Estonia, at the very least, shares deep historical ties with Sweden and Finland, while Latvia and Lithuania are also seeking protection from Stockholm."
 NW_SWE.49.a: "We support this idea."
 NW_SWE.49.b: "We object; we will not be able to defend them."

 NW_SWE.50.t: "Alliance Members Object"
 NW_SWE.50.d: "The members of the Nordic Defense Union have voiced their disapproval regarding our idea to invite the Baltic states into the alliance. They argue that this adventurous move would merely overextend the already limited defense capabilities of our nations, and that providing real assistance to the Baltic states in the event of actual aggression would be impossible."
 NW_SWE.50.a: "Very well, let us abandon this idea."

 NW_SWE.52.t: "The New Malmö Conference"
 NW_SWE.52.d: "On December 18 and 19, 1914, the famous 'Three Kings Meeting' took place in Malmö. Following a somewhat turbulent period that included the dissolution of the Swedish-Norwegian Union, King Oscar II was succeeded by Haakon VII as King of Norway—the younger brother of the Danish King, Christian X. After Oscar's death in 1907 and the accession of his son Gustaf V, internal tensions within Scandinavia remained unresolved. However, during this historic meeting, the Scandinavian monarchs reached a mutual understanding and forged a common stance on maintaining strict neutrality in the ongoing war. The Swedish government has now initiated a proposal to hold a similar new conference to establish a unified foreign policy for the Nordic nations."
 NW_SWE.52.a: "Excellent"
 NW_SWE.53.t: "Criticism of Government Inaction"
 NW_SWE.53.d: "Following the debate and passage of yet another social bill in the Riksdag, deputies from the right-wing parties demanded urgent rearmament and modernization of the military. Against the backdrop of the militarization of Germany and almost all of Europe, sitting idly by and relying on the League of Nations or pacifist neutrality is unacceptable; we must be able to defend ourselves with our own hands and weapons—such are their main arguments. Furthermore, they are using these same talking points in their street and newspaper agitation, hoping to hurt the Social Democratic Party's results in the upcoming elections."
 NW_SWE.53.a: "First and foremost, the people must have something to defend, not just the means to do so"
 
 NW_SWE.54.t: "Dissent Within the Party"
 NW_SWE.54.d: "Following the allocation of funding for another military rearmament program, discontent with the Prime Minister's actions has arisen within our party. The most left-wing and radical members are voicing their disapproval that we have stopped implementing social reforms in accordance with our campaign promises and the Prime Minister's own 'People's Home' plan. They believe we are paying too much attention to military matters when our first priority should be improving the lives of all the country's residents."
 NW_SWE.54.a: "We cannot afford to ignore the military"
 
 NW_SWE.55.t: "The Coffee Tariff"
 NW_SWE.55.d: "Left-wing deputies Johan Helmer Brädefors and Hilding Hagberg have demanded the abolition of the coffee import tariff, stating that the tax hits the poorest segments of the population, turning an everyday beverage into a luxury. The Social Democrats and Communists are actively campaigning for the abolition or reduction of this duty. They argue that the coffee tax is a form of hidden indirect taxation that hits low-income and large families the hardest, for whom coffee is an essential and affordable daily staple. According to financial reports, Swedish state revenues from the coffee tariff for the 1935 fiscal year amounted to 21.6 million kronor."
 NW_SWE.55.a: "We will support their proposal"
 NW_SWE.55.b: "We will use this in our agitation"
 NW_SWE.55.c: "We have no time for this right now"
 
 NW_SWE.56.t: "The Struggle Against the Poverty Disqualification"
 NW_SWE.56.d: "Left-wing parties have launched an active parliamentary offensive against one of the main exceptions to universal suffrage, which was adopted in 1921—the disenfranchisement of those receiving long-term financial assistance from the state. Under current law, citizens who cannot support themselves due to poverty, illness, or disability and are under state care are barred from voting. The Social Democrats insist that elderly people in nursing homes are unjustly deprived of their vote, as poverty is an economic tragedy, not a civic crime. Conservatives are pushing back, arguing that a person dependent on the state cannot be an independent voter."
 NW_SWE.56.a: "Let us make every effort to pass this amendment"
 NW_SWE.56.b: "We will only use this for agitation"
 NW_SWE.56.c: "We have no time for this right now"
 
 NW_SWE.57.t: "A Parliamentary Interpellation"
 NW_SWE.57.d: "Fierce debates have erupted in parliament, sparked by Communist deputy Ture Nerman. Nerman submitted an official interpellation to the Minister of Education demanding political asylum for Jewish scientists, artists, and writers fleeing Nazi Germany. The First Chamber of Parliament is divided. Right-wing forces argue that Sweden is not a country of immigration and that meddling in German affairs will harm Swedish neutrality. The Socialists countered that the country has a duty to protect Europe's intellectual elite."
 NW_SWE.57.a: "We will grant asylum to the intellectuals"
 NW_SWE.57.b: "We cannot afford to run a charity for foreigners right now"
 
 NW_SWE.58.t: "Expanding Voting Rights"
 NW_SWE.58.d: "Parliament continues to debate the expansion of voting rights through amendments to universal suffrage legislation. Today, discussions centered on granting voting rights to marginalized groups. Specifically, the repeal of restrictions for individuals in correctional facilities and prisons is under consideration. Liberal forces and the Social Democrats insist that isolation from society should not strip a person of their basic civil rights. If this amendment passes, the share of eligible voters will rise to 62% of the total population."
 NW_SWE.58.a: "We support this amendment"
 NW_SWE.58.b: "We cannot give prisoners the right to vote"
 
 NW_SWE.59.t: "Debates on the Death Penalty"
 NW_SWE.59.d: "Although capital punishment has not been used in peacetime in Sweden since 1910 (and was officially abolished in 1921), it still remains in the penal code for wartime. A draft bill to narrow the scope of the death penalty even under wartime conditions has been brought before parliament. Humanistically inclined deputies are calling for the complete removal of this institution from Swedish law. However, some representatives advocate keeping the measure, at least temporarily, given the darkening global situation and the rise of radicalism abroad."
 NW_SWE.59.a: "Support the complete abolition of the death penalty"
 NW_SWE.59.b: "Let us strictly limit the list of crimes punishable by death"
 NW_SWE.59.c: "We are not interested in this bill right now"
 
 NW_SWE.60.t: "Debates on Migration Policy"
 NW_SWE.60.d: "Amid the persecution of Jews and political dissidents in Nazi Germany, the Riksdag is debating a new revision of the Aliens Act. Representatives of the right-wing parties and the Farmers' League are demanding strict immigration limits, fearing labor market competition and assimilation issues. Above all, they fear an influx of Jews fleeing rising antisemitism within Germany. The rhetoric of the early 1920s is resurfacing, when the Russian Civil War drove a large wave of Jewish migration westward into Europe.\n\nThe new law is intended to allow political refugees to migrate legally into the country while simultaneously serving as a preventive tool against mass immigration. Parliamentarians openly state that the law must have a 'deterrent effect,' protecting Swedish society from a potential mass influx of migrants.\n\nFurthermore, this will be the first Swedish law to establish a legal definition of a political refugee and solidify their status. Local police will no longer have the authority to summarily deport foreigners at the border who claim political persecution at home. Such cases will now be referred to a central authority—the National Board of Health and Welfare. However, the right wing proposes inserting a clause that would separate those fleeing racial persecution from political refugees."
 NW_SWE.60.a: "Let us put it to a vote as it is"
 NW_SWE.60.b: "Let us accept the amendments proposed by the right"
 NW_SWE.60.c: "We will not take a clear stance on this law"
 
 NW_SWE.61.t: "Decriminalization of Contraception"
 NW_SWE.61.d: "Since 1910, the country has enforced an anti-contraceptive law prohibiting the public sale, advertising, and distribution of information about birth control 'among the general public.' Back in 1936, the Government Population Commission published a groundbreaking report recommending the complete repeal of this law for the greater good of society. Now, these findings have landed on the desks of parliamentarians, sparking a clash of fundamentally opposing worldviews.\n\nConservatives and right-wing forces claim that legalizing contraception will sanction 'national suicide.' Sweden is currently experiencing a severe demographic crisis with record-low birth rates. Opponents of the repeal believed that access to contraceptives would lead to the complete extinction of the Swedish nation.\n\nThe Social Democrats and Liberals turned this argument upside down. Drawing on Alva and Gunnar Myrdal's famous 1934 book 'Crisis in the Population Question,' they argued that people today refuse to have children out of poverty and fear of unplanned pregnancy. If families are given the ability to consciously plan for children, the state will be able to guarantee them social support. Swedish society must focus not on the quantity of 'accidental' children, but on the quality of life for wanted children.\n\nThe religious wing and conservatives insist that repealing the ban will lead to the collapse of traditional morality and push the youth toward promiscuity and sin. They argue that the fear of unwanted pregnancy is the main barrier keeping society from 'debauchery.' Radical activists (such as Elise Ottesen-Jensen, founder of the Swedish Association for Sexuality Education) and left-wing politicians decry the extreme hypocrisy of the law. The current ban does not stop people from having sex, yet it leads to horrific consequences: a massive number of back-alley, maiming abortions, infanticide, and destitution in large working-class families unable to feed their children. They framed contraception not as 'immorality,' but as a matter of basic medicine, hygiene, and humanity."
 NW_SWE.61.a: "Let us vote to repeal this law"
 NW_SWE.61.b: "We will not push too hard for the bill's passage, but we will use it for agitation"
 NW_SWE.61.c: "We cannot support repealing this law right now"
 
 NW_SWE.62.t: "A Failed Vote"
 NW_SWE.62.d: "The vote in the Riksdag on the bill promoted by our government failed because a number of deputies withdrew their support during the debate."
 NW_SWE.62.a: "We must find new ways to achieve our goals"
 
 NW_SWE.63.t: "The Nordic Council"
 NW_SWE.63.d: "The Swedish government proposes establishing an intergovernmental organization — the Nordic Council. This body would provide a regular platform for cooperation among the governments of Scandinavia and potentially the entire Baltic region, thereby improving the coordination of our actions in the face of a growing external military threat."
 NW_SWE.63.a: "We support this idea"
 NW_SWE.63.b: "We will not participate in this"
 
 NW_SWE.64.t: "Failure of Negotiations"
 NW_SWE.64.d: "The establishment of the Nordic Council was derailed by the passivity of Denmark and Norway on this matter. Perhaps next time they will be more interested in such a project."
 NW_SWE.64.a: "We must unite, not fall apart"
 NW_SWE_64_tt: "§YAfter some time, we will be able to propose establishing the Nordic Council once again§!"
 
 NW_SWE.66.t: "Collapse of the National Government"
 NW_SWE.66.d: "With the end of hostilities in Europe, the purpose of the national government has completely disappeared, and long-standing contradictions between the parties have spilled out into the open. The leaders of the parties that formed the ruling coalition have announced their withdrawal from it. Now we must once again deal with parliamentary debates and seek support from deputies to pass new bills."
 NW_SWE.66.a: "Peacetime returns once more"
 
 NW_SWE.67.t: "Invitation to the Nordic Council"
 NW_SWE.67.d: "The countries of the Nordic Council have extended an official invitation to our government to join their organization. It is a body for intergovernmental coordination, meaning it entails no military obligations, but it will allow us to demonstrate our solidarity and intention to cooperate with Scandinavia."
 NW_SWE.67.a: "We will join"
 NW_SWE.67.b: "No, we will maintain our neutrality"
 
 NW_SWE.68.t: "Finland Rejects the Proposal"
 NW_SWE.68.d: "The Finnish government has sent us its official refusal to join the Nordic Council. They prefer not to violate their neutrality, although they express gratitude for the invitation."
 NW_SWE.68.a: "Maybe later"
 
 NW_SWE.69.t: "Common Passport Zone"
 NW_SWE.69.d: "At a regular session of the Nordic Council, the Swedish government put forward a proposal to adopt a unified passport union agreement among Council members. Thanks to this, citizens of our countries will be able to travel freely between member states, thereby creating a single labor market."
 NW_SWE.69.a: "We agree with this"
 NW_SWE.69.b: "This goes against our interests"
 
 NW_SWE.70.t: "Passport Proposal Blocked"
 NW_SWE.70.d: "Sweden's proposal to create a single labor market through an agreement on the mutual recognition of passports among Nordic Council members was rejected during discussions at the Council's regular intergovernmental session."
 NW_SWE.70.a: "That was to be expected"
 
 NW_SWE.71.t: "Passport Agreement Concluded"
 NW_SWE.71.d: "Sweden's proposal to create a single labor market through an agreement on the mutual recognition of passports among Nordic Council members was adopted during discussions at the Council's regular intergovernmental session. Now every citizen of a Nordic Council country can travel to and find employment in another member state, provided language barriers do not get in the way."
 NW_SWE.71.a: "Excellent"
 
 NW_SWE.72.t: "Nordic Council Economic Cooperation"
 NW_SWE.72.d: "At a regular session of the Nordic Council, the Swedish government put forward a proposal to adopt an economic cooperation agreement among Council members. Thanks to this, we will create a single trade market by abolishing import tariffs between member states."
 NW_SWE.72.a: "We agree with this"
 NW_SWE.72.b: "This goes against our interests"
 
 NW_SWE.73.t: "Economic Cooperation Proposal Rejected"
 NW_SWE.73.d: "Sweden's proposal to create a single trade market through an agreement on the mutual abolition of import tariffs among Nordic Council members was rejected during discussions at the Council's regular intergovernmental session."
 NW_SWE.73.a: "That was to be expected"
 
 NW_SWE.74.t: "Economic Cooperation Agreement Concluded"
 NW_SWE.74.d: "Sweden's proposal to create a single trade market through an agreement on the mutual abolition of import tariffs among Nordic Council members was adopted during discussions at the Council's regular intergovernmental session. This will facilitate trade between our countries and provide a boost to economic development."
 NW_SWE.74.a: "Excellent"
 
 NW_SWE.77.t: "The Army Occupies Northern Finland"
 NW_SWE.77.d: "With Finland on the verge of capitulation, our country's military leadership has begun executing its long-standing contingency plan. Viewing our eastern neighbor as a 'natural shield' against Moscow, the General Staff ordered army units to cross the state border into Finnish territory to hold a favorable bridgehead on its soil. This will open opportunities for cooperation with the legitimate Finnish government and army, allowing them to evacuate there under our support and cover. In effect, this means entering the war on Finland's side—and moreover, not only without parliamentary consent, but without even notifying parliament."
 NW_SWE.77.a: "This is outrageous! The military must return immediately!"
 NW_SWE.77.b: "This is a necessary measure"
 
 NW_SWE.78.t: "Military Ultimatum"
 NW_SWE.78.d: "The army has refused to obey the civilian government. Negotiations with the King have also failed—he has sided with the military. All of this threatens to escalate into a serious political crisis amidst entering the war, so we must immediately decide on our next steps."
 NW_SWE.78.a: "We must uphold parliamentary supremacy!"
 NW_SWE.78.b: "We resign in protest"
 
 
 NW_SWE_news.1.t: "[GetNewsHeadline]Sweden Passes a New Defense Act"
 NW_SWE_news.1.d: "Following lengthy debates, the Swedish Riksdag has finally passed a new defense bill. This marks the culmination of nearly six years of exhaustive work by the Defense Commission. The previous Defense Act of 1925 had drastically gutted funding for the army and navy amidst post-war pacifist rhetoric and faith in the League of Nations. Modern realities, however, dictate that even a neutral Nordic state must independently safeguard its security. The passage of the bill was championed primarily by right-wing parties and the military elite, while the Social Democrats fought to secure funding for their social welfare programs instead."
 NW_SWE_news.1.a: "Sweden is now rearming as well."

 NW_SWE_news.2.t: "[GetNewsHeadline]Remilitarization of the Åland Islands"
 NW_SWE_news.2.d: "Sweden and Finland have concluded an agreement regarding the joint remilitarization of the Åland Islands. The so-called Åland Question originated in the early 19th century when these lands were ceded to Russia following yet another war with Sweden. Due to their close proximity to Stockholm, the Ålands hold immense strategic value, making their status a point of contention among Baltic powers for generations. Following the Great War, the League of Nations resolved the matter by granting the islands wide autonomy within independent Finland under a strict demilitarized status, which mandated the liquidation of all coastal fortifications. Today, faced with mounting external threats, Sweden and Finland stand united once more."
 NW_SWE_news.2.a: "An interesting turn of events."

 NW_SWE_news.3.t: "[GetNewsHeadline]The Day of the North"
 NW_SWE_news.3.d: "Faced with rising external threats, the five Nordic states—Sweden, Denmark, Norway, Finland, and Iceland—have organized a joint interstate celebration known as the Day of the North (Nordens dag). The central motto of the day, as reported by the press, was 'A United North in a Divided Europe.' National radio stations across all five nations broadcasted a single shared program. The event commenced at 7:45 AM with the simultaneous tolling of cathedral bells across all Scandinavian capitals. The culmination of the day was a broadcast featuring successive speeches by the monarchs of Sweden (Gustaf V), Denmark (Christian X), Norway (Haakon VII), and the President of Finland (Pehr Evind Svinhufvud), all reaffirming the unbreakable peace between their peoples. The broadcast was even transmitted to the United States for the Scandinavian diaspora."
 NW_SWE_news.3.a: "Is this a step toward a unified Scandinavia?"
 NW_SWE_news.3.b: "Long live Scandinavia!"
 
 
