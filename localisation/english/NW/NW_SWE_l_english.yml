 ##############
 ### Нацдухи ###
 ##############
 
 SWE_gustaf_V: "Gustav V"
 SWE_gustaf_V_desc: "The 78-year-old King of Sweden, Gustaf V has sat on the throne for nearly three decades, becoming a symbol of stability, continuity, and national unity in a rapidly changing world. Although early in his reign he actively intervened in politics and clashed with the Liberals and Social Democrats over defense matters, following the Great War and the revolution in Russia, the monarch definitively accepted the principles of parliamentarism, establishing smooth and constructive relations even with Social Democratic governments. Widowed in 1930, Gustaf V enjoys broad popularity among the people not only as a non-partisan arbiter and experienced diplomat — maintaining close ties with other European monarchies and adhering to a course of neutrality amid rising tensions in Europe — but also as a passionate sports enthusiast. Under the pseudonym "Mr. G," he continues to compete regularly in international tennis tournaments, astonishing his contemporaries with his longevity and energy."
 SWE_progerman_elites: "Pro-German Elites"
 SWE_progerman_elites_desc: "Germanophile sentiments were widespread among the Swedish elites since the turn of the century. Many members of the aristocracy had intermarried with German royal houses, and many Swedish companies also had business interests in Germany. The Nazis' rise to power was initially welcomed by Sweden's right-wing forces, but over time, Nazi policies began to raise questions and caused rather irritation and inconvenience for conducting trade and diplomatic relations with Germany."
 SWE_defense_law: "Defence Act of 1925"
 SWE_defense_law_desc: "The pacifist sentiments of the 1920s led to the adoption of a severely slashed national military budget in 1925. It entailed radical expenditure cuts for both the army and the navy. This resulted in Sweden falling heavily behind in military development in recent years. Since the late 1920s, military officials and right-wing politicians have been fighting for increased defense spending, viewing it as essential for the country's security in a hostile environment."
 SWE_demographic_crisis: "Demographic Crisis"
 SWE_demographic_crisis_desc: "In the 1930s, Sweden faced an acute demographic crisis caused by a rapid decline in birth rates to one of the lowest levels in Europe (around 14–14.5 births per thousand inhabitants, bringing the reproduction rate below the replacement level) amid urbanization, overcrowded housing, and the aftermath of the Great Depression. Another major factor was the mass emigration of the impoverished rural population to the New World, which had lasted for about a century from the 1820s until the outbreak of the Great War in 1914. A decisive turning point in recognizing and addressing this issue came after the 1934 publication of the landmark book Crisis in the Population Question (Kris i befolkningsfrågan) by sociologists Alva and Gunnar Myrdal. In it, the authors warned of the threat of an aging nation and depopulation, proposing large-scale social reforms instead of prohibitive measures. Against this backdrop, the Government Population Commission was established in 1935."
