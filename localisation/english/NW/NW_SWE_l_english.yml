 SWE_left_roads: "Left-hand Traffic"
 SWE_left_roads_desc: "Today, Sweden retains its historically established left-hand traffic, while the vast majority of cars in the country—both imported and produced by domestic manufacturers like Volvo—are left-hand drive, making overtaking on narrow country roads particularly dangerous. As motorization has grown over the past decade, this contradiction has sharpened. Combined with the fact that all of Sweden's land neighbors (Norway and Finland) already use right-hand traffic, questions about the need for reform and a transition to the right side have begun to be raised regularly in the Riksdag and the press."
