 SWE_progerman_elites: "Pro-German Elites"
 SWE_progerman_elites_desc: "Germanophile sentiments were widespread among the Swedish elites since the turn of the century. Many members of the aristocracy had intermarried with German royal houses, and many Swedish companies also had business interests in Germany. The Nazis' rise to power was initially welcomed by Sweden's right-wing forces, but over time, Nazi policies began to raise questions and caused rather irritation and inconvenience for conducting trade and diplomatic relations with Germany."
 SWE_defense_law: "Defence Act of 1925"
 SWE_defense_law_desc: "The pacifist sentiments of the 1920s led to the adoption of a severely slashed national military budget in 1925. It entailed radical expenditure cuts for both the army and the navy. This resulted in Sweden falling heavily behind in military development in recent years. Since the late 1920s, military officials and right-wing politicians have been fighting for increased defense spending, viewing it as essential for the country's security in a hostile environment."
