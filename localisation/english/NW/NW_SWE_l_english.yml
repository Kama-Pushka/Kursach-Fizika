 SWE_bearing_category: "Bearing Exports"
 SWE_bearing_category_desc: "Bearings are one of the most vital components in mechanical engineering; no moving device—be it a machine tool, vehicle, aircraft, or tank—can be manufactured without them. At the same time, manufacturing a bearing is one of the most complex industrial tasks in the modern world. The world's leading bearing manufacturer is located in our country—the company SKF. Its bearings are valued worldwide for their superior quality, attracting machine-building plants from a wide variety of nations. For this reason, the issue of exporting them to belligerent powers becomes just as dangerous and critical for the entire nation as, for example, the export of iron ore. All the world's major powers will closely monitor whom we sell SKF products to, as this can impact the production of tanks, aircraft, and ships in those countries. Accordingly, this will also influence those powers' aggressive plans against our nation.\n\n\n\nUndistributed quota: [?SWE_undistributed_bearings|0+%%]\n\nGerman quota: [?SWE_bearings_of_germany|0+%%]\n\nBritish quota: [?SWE_bearings_of_britain|0+%%]\n\nFrench quota: [?SWE_bearings_of_france|0+%%]\n\nItalian quota: [?SWE_bearings_of_italy|0+%%]\n\nUS quota: [?SWE_bearings_of_usa|0+%%]"
