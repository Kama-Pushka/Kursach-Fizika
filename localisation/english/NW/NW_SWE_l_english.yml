 SWE_SCENARIO_DESC: "Sweden, led by its Social Democratic government, has successfully emerged from the Great Depression, yet will the voters appreciate all of its plans for social reform? Most importantly, amidst the brewing conflict in Europe, will they not recall that it was Prime Minister Per Albin Hansson who pushed through the 1925 Defence Act, which radically slashed military spending and left Sweden defenseless in the face of its enemies?"


